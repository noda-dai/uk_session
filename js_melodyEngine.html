<script>
// ===================================================================
// js_melodyEngine.txt  ― メロディ・ハーモニー調和タブ譜エンジン v3
//
// v2 → v3 の最大変更: 「全体俯瞰型メロディ設計」への刷新
//
// 【旧アーキテクチャの問題】
//   小節ループ × ローカルルール積み重ね
//   → 全体の方向性がなく「音符の羅列」になる
//   → コードを1つ追加しても隣の小節を見ていない
//
// 【新アーキテクチャ: 2フェーズ設計】
//   Phase G (Global): 全コード進行を俯瞰して「メロディ骨格」を先に確定
//     G1: 進行タイプ自動判定（15パターン）
//     G2: 全体フォルム決定（arch/rise/fall/valley）
//     G3: フレーズ境界を先に確定（4小節単位）
//     G4: 各フレーズの「頂点音・開始音・終止音」をMIDIで先決め
//     G5: 各小節の「目標音 targetMidi」をテーブルとして確定
//   Phase L (Local): 小節ループ時に骨格を参照しながら音符配置
//     L1: beat3アンカー廃止（骨格のtargetMidiに従う）
//     L2: モチーフidxを2小節またぎに変更（フレーズ感を出す）
//     L3: 弱拍コイントス廃止（骨格の方向性に従う）
//     L4: フレット超過時のreturn廃止（オクターブ補正で継続）
//     L5: preferredStrings をC/G弦含む全弦に拡張
//
// コードを追加・変更するたびに buildSoloScore() / buildScoreFromChords()
// が呼ばれ、Phase Gが全コード進行を再分析して骨格を再計算する。
// ===================================================================

// ---------------------------------------------------------------
// データ構造定義（全フェーズ共通）
// ---------------------------------------------------------------

/**
 * 1音符を表すオブジェクト
 * @typedef {Object} NoteEvent
 */

/**
 * 1小節を表すオブジェクト
 * @typedef {Object} Measure
 */

/**
 * スコア全体を表すオブジェクト
 * @typedef {Object} Score
 */

// ---------------------------------------------------------------
// ファクトリ関数
// ---------------------------------------------------------------

function makeNoteEvent(midi, duration, beat, role='passing') {
  return {
    type:         midi < 0 ? 'rest' : 'note',
    midi,
    duration,
    beat,
    stringIdx:    null,
    fret:         null,
    role,
    technique:    'normal',
    tieOut:       false,  // [Lyrical] 次音へタイ接続するか
    sustainHint:  false,  // [Lyrical] 余韻保持を優先する音か
  };
}

function makeScore(key, chordNames, style = 'arpeggio', genre = null) {
  const preset = genre ? (GENRE_PRESETS?.[genre] ?? null) : null;
  return {
    key,
    tempo:         preset ? preset.tempo : 100,
    timeSignature: [4, 4],
    style,
    genre,
    measures: chordNames.map((chord, i) => ({
      number:      i + 1,
      chord,
      chordFrets:  _resolveChordFrets(chord, key),
      melody:      [],
      beatsPerBar: 4,
    })),
  };
}

function _resolveChordFrets(chordName, key) {
  const candidates = getChordCandidates(chordName, key, 'low');
  if (candidates.length === 0) return [0, 0, 0, 0];
  return candidates[0].frets;
}

// ---------------------------------------------------------------
// Phase 2 ①：コード構成音の音度情報を取得する
// ---------------------------------------------------------------

function getChordStructure(chordName) {
  // [P2-3] スラッシュコード処理: "C/E" → ルートはC、ベース音Eは構造解析では無視
  //   分母のベース音はタブ譜のボイシング層で別途処理されるため、ここでは上声部のみ解析
  //
  // [Fix] "6/9" や "6/9" 形式のコードを誤処理しないよう判定を厳密化:
  //   '/' の後ろが音名 (A-G, フラット/シャープ含む) の場合のみスラッシュコードとして扱う
  //   例: 'C/E'  → スラッシュコード → baseName='C'    ✓
  //       'C6/9' → 分数表記の一部  → baseName='C6/9' ✓（誤処理を防ぐ）
  const slashIdx = chordName.indexOf('/');
  const isSlashChord = slashIdx > 0 && /^[A-G][b#]?/.test(chordName.slice(slashIdx + 1));
  const baseName = isSlashChord ? chordName.slice(0, slashIdx) : chordName;

  const rootMatch = baseName.match(/^([A-G][b#]?)/);
  if (!rootMatch) return null;
  const rootStr = rootMatch[1];

  const ROOT_PC = {
    'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,
    'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,
    'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,
  };
  const rootPc = ROOT_PC[rootStr];
  if (rootPc === undefined) return null;

  const suffix = baseName.slice(rootStr.length);

  let semitones, roleNames;

  // ── 既存サフィックス ──────────────────────────────────────────
  if      (suffix === 'maj7')              { semitones=[0,4,7,11];       roleNames=['root','color','stable','tension']; }
  else if (suffix === 'm7')                { semitones=[0,3,7,10];       roleNames=['root','color','stable','tension']; }
  else if (suffix === 'm7b5'||suffix==='ø'){ semitones=[0,3,6,10];       roleNames=['root','color','color','tension'];  }
  else if (suffix === 'dim7')              { semitones=[0,3,6,9];        roleNames=['root','color','color','tension'];  }
  else if (suffix === 'dim')               { semitones=[0,3,6];          roleNames=['root','color','color'];            }
  else if (suffix === 'aug')               { semitones=[0,4,8];          roleNames=['root','color','stable'];           }
  else if (suffix === 'sus4')              { semitones=[0,5,7];          roleNames=['root','color','stable'];           }
  else if (suffix === 'sus2')              { semitones=[0,2,7];          roleNames=['root','color','stable'];           }
  else if (suffix === '6')                 { semitones=[0,4,7,9];        roleNames=['root','color','stable','tension']; }
  else if (suffix === 'm6')                { semitones=[0,3,7,9];        roleNames=['root','color','stable','tension']; }
  else if (suffix === '9')                 { semitones=[0,4,7,10,14];    roleNames=['root','color','stable','tension','tension']; }
  else if (suffix === 'm9')                { semitones=[0,3,7,10,14];    roleNames=['root','color','stable','tension','tension']; }
  else if (suffix === '7')                 { semitones=[0,4,7,10];       roleNames=['root','color','stable','tension']; }
  else if (suffix === 'm')                 { semitones=[0,3,7];          roleNames=['root','color','stable'];           }

  // ── [P2-3] 追加サフィックス ──────────────────────────────────
  // add9: 長3度+完全5度+長9度（7thなし。明るい色彩感）
  else if (suffix === 'add9')              { semitones=[0,4,7,14];       roleNames=['root','color','stable','tension']; }
  // madd9 / m(add9): マイナー+9th（7thなし）
  else if (suffix === 'madd9'||suffix==='m(add9)') { semitones=[0,3,7,14]; roleNames=['root','color','stable','tension']; }
  // maj9: maj7+9th
  else if (suffix === 'maj9')              { semitones=[0,4,7,11,14];    roleNames=['root','color','stable','tension','tension']; }
  // 11: ドミナント11th（V11コード）
  else if (suffix === '11')                { semitones=[0,4,7,10,14,17]; roleNames=['root','color','stable','tension','tension','color']; }
  // m11: マイナー11th
  else if (suffix === 'm11')               { semitones=[0,3,7,10,14,17]; roleNames=['root','color','stable','tension','tension','color']; }
  // maj11: maj7+9+11
  else if (suffix === 'maj11')             { semitones=[0,4,7,11,14,17]; roleNames=['root','color','stable','tension','tension','color']; }
  // 13: ドミナント13th（9thは省略可）
  else if (suffix === '13')                { semitones=[0,4,7,10,14,21]; roleNames=['root','color','stable','tension','tension','color']; }
  // m13: マイナー13th
  else if (suffix === 'm13')               { semitones=[0,3,7,10,14,21]; roleNames=['root','color','stable','tension','tension','color']; }
  // maj13: maj7+9+13
  else if (suffix === 'maj13')             { semitones=[0,4,7,11,14,21]; roleNames=['root','color','stable','tension','tension','color']; }
  // 7sus4: ドミナント7th+sus4（サスペンドドミナント）
  else if (suffix === '7sus4')             { semitones=[0,5,7,10];       roleNames=['root','color','stable','tension']; }
  // 7sus2
  else if (suffix === '7sus2')             { semitones=[0,2,7,10];       roleNames=['root','color','stable','tension']; }
  // aug7 / 7#5: オーギュメントドミナント
  else if (suffix === 'aug7'||suffix==='7#5'||suffix==='7+5') {
                                             semitones=[0,4,8,10];       roleNames=['root','color','color','tension'];  }
  // 7b9: ドミナント7th + フラット9th（強い解決感）
  else if (suffix === '7b9')               { semitones=[0,4,7,10,13];    roleNames=['root','color','stable','tension','tension']; }
  // 7#9: ドミナント7th + シャープ9th（ヘンドリクスコード）
  else if (suffix === '7#9')               { semitones=[0,4,7,10,15];    roleNames=['root','color','stable','tension','tension']; }
  // 6/9: 6th + 9th（7thなし）
  else if (suffix === '6/9'||suffix==='69'){ semitones=[0,4,7,9,14];     roleNames=['root','color','stable','tension','tension']; }
  // フォールバック: メジャートライアド
  else                                     { semitones=[0,4,7];          roleNames=['root','color','stable'];           }

  const intervals = {};
  semitones.forEach((s, i) => {
    const pc = s % 12;
    if (!(pc in intervals)) {
      intervals[pc] = roleNames[i];
    }
  });

  return { rootPc, intervals };
}

// ---------------------------------------------------------------
// Phase 2 ②：classifyNote
// ---------------------------------------------------------------

function classifyNote(midi, chordName, key, scaleMode = 'major') {
  const pc = midi % 12;

  if (scaleMode === 'blues') {
    const keyDef  = KEY_DEFS.find(d => d.key === key);
    const rootIdx = keyDef ? keyDef.idx : 0;
    const offset  = (pc - rootIdx + 12) % 12;
    if (offset === 6) return 'color';
  }

  const struct = getChordStructure(chordName);
  if (struct) {
    const offset = (pc - struct.rootPc + 12) % 12;
    if (offset in struct.intervals) {
      return struct.intervals[offset];
    }
  }

  const keyDef  = KEY_DEFS.find(d => d.key === key);
  const rootIdx = keyDef ? keyDef.idx : 0;

  // [P1-4] コード機能に応じてスケールモードを切り替える
  // 曲全体の scaleMode を基準に、個別コードの性質で上書き判定する
  const effectiveMode = _getChordScaleMode(struct, scaleMode);

  const modeScale = (typeof buildModeScale === 'function')
    ? buildModeScale(struct ? struct.rootPc : rootIdx, effectiveMode)
    : (KEY_DATA[key]?.scale || []);
  const scalePcs = new Set(modeScale.map(n => CHROMATIC.indexOf(n)));
  if (scalePcs.has(pc)) {
    return 'passing';
  }

  return 'chromatic';
}

/**
 * [P1-4] コード構造からそのコードで使うべきスケールモードを推定する。
 *
 * 判定優先順:
 *   1. ドミナント7th コード (suffix '7') → mixolydian
 *      セカンダリードミナントもここに入る（キー外のルートでも適用）
 *   2. マイナーコード (m, m7, m9) → dorian
 *      ドリアンはナチュラルマイナーより長6度を含み、ポップ/ジャズで自然に響く
 *   3. ハーフディミニッシュ (m7b5) → minor（ロクリアン的）
 *   4. ディミニッシュ (dim, dim7) → chromatic approach（全音音階的; 既存のchromatic扱いに委ねる）
 *   5. それ以外 → 引数の scaleMode をそのまま使う
 *
 * @param {Object|null} struct  getChordStructure の返り値
 * @param {string} globalMode   曲全体の scaleMode
 * @returns {string}  SCALE_MODES のキー
 */
function _getChordScaleMode(struct, globalMode) {
  if (!struct) return globalMode;

  const ivls = struct.intervals; // { semiOffset: role }

  // intervals のキー(半音数)の集合
  const has = (semi) => semi in ivls;

  // ドミナント7th: 長3度(4) + 短7度(10) を持つ
  if (has(4) && has(10) && !has(11)) return 'mixolydian';

  // ハーフディミニッシュ: 短3度(3) + 減5度(6) + 短7度(10)
  if (has(3) && has(6) && has(10)) return 'minor';

  // マイナー系: 短3度(3) を持ち、減5度(6) を持たない
  if (has(3) && !has(6)) return 'dorian';

  // ディミニッシュ: 短3度(3) + 減5度(6)、7度なし
  // → 全音音階/コンビネーションオブディミニッシュが理想だが
  //   複雑になるので minor にフォールバック
  if (has(3) && has(6) && !has(10)) return 'minor';

  return globalMode;
}

// ---------------------------------------------------------------
// Phase 2 ③：buildChordMidiSet
// ---------------------------------------------------------------

function buildChordMidiSet(
  chordName,
  key,
  midiLow  = UKULELE_MIDI_RANGE.melodyLow,
  midiHigh = UKULELE_MIDI_RANGE.melodyHigh
) {
  const struct = getChordStructure(chordName);
  if (!struct) return [];

  const results = [];
  for (let midi = midiLow; midi <= midiHigh; midi++) {
    const pc     = midi % 12;
    const offset = (pc - struct.rootPc + 12) % 12;
    if (offset in struct.intervals) {
      results.push({ midi, role: struct.intervals[offset] });
    }
  }

  const ROLE_ORDER = { root:0, stable:1, color:2, tension:3 };
  results.sort((a, b) => {
    const d = (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9);
    return d !== 0 ? d : a.midi - b.midi;
  });

  return results;
}

// ---------------------------------------------------------------
// Phase 2 ④：buildScaleMidiSet
// ---------------------------------------------------------------

function buildScaleMidiSet(
  key,
  chordName,
  midiLow  = UKULELE_MIDI_RANGE.melodyLow,
  midiHigh = UKULELE_MIDI_RANGE.melodyHigh,
  scaleMode = 'major'
) {
  const results = [];

  for (let midi = midiLow; midi <= midiHigh; midi++) {
    const role = classifyNote(midi, chordName, key, scaleMode);
    if (role !== 'chromatic') {
      results.push({ midi, role });
    }
  }

  const ROLE_ORDER = { root:0, stable:1, color:2, tension:3, passing:4 };
  results.sort((a, b) => {
    const d = (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9);
    return d !== 0 ? d : a.midi - b.midi;
  });

  return results;
}

// ---------------------------------------------------------------
// Phase 2 ⑤：コード間の共通トーン検出
// ---------------------------------------------------------------

function getCommonTones(chordA, chordB) {
  const sA = getChordStructure(chordA);
  const sB = getChordStructure(chordB);
  if (!sA || !sB) return [];

  const pcsA = new Set(
    Object.keys(sA.intervals).map(Number).map(offset => (sA.rootPc + offset) % 12)
  );
  const pcsB = new Set(
    Object.keys(sB.intervals).map(Number).map(offset => (sB.rootPc + offset) % 12)
  );

  return [...pcsA].filter(pc => pcsB.has(pc));
}

// ---------------------------------------------------------------
// Phase 3 ①：リズムパターン定義
// ---------------------------------------------------------------

const RHYTHM_PATTERNS = {
  quarter:    [1, 1, 1, 1],
  eighth:     [0.5,0.5,0.5,0.5,0.5,0.5,0.5,0.5],
  dotted:     [1.5,0.5,1.5,0.5],
  syncopated: [0.5,1,0.5, 0.5,1,0.5],
  ballad:     [2, 1, 1],
  swing:      [0.75,0.25,0.75,0.25,0.75,0.25,0.75,0.25],
  mixed:      [1, 0.5, 0.5, 0.5, 0.5, 1],
};

// ---------------------------------------------------------------
// Phase 3 ②：奏法判定
// ---------------------------------------------------------------

function assignTechnique(prevSi, prevFret, si, fret) {
  if (fret === 0) return 'open';
  if (prevSi < 0 || prevSi !== si) return 'normal';
  const diff = fret - prevFret;
  if (diff === 0) return 'normal';
  if (diff === 1 || diff === 2)  return 'hammer_on';
  if (diff === -1 || diff === -2) return 'pull_off';
  if (Math.abs(diff) >= 3 && Math.abs(diff) <= 5) return 'slide';
  return 'normal';
}

// ---------------------------------------------------------------
// Phase 3 ③：拍の強弱
// ---------------------------------------------------------------

function getBeatStrength(beat, beatsPerBar = 4) {
  if (beat === 1)              return 'strong';
  if (beat % 1 !== 0)          return 'offbeat';
  if (beatsPerBar === 4 && beat === 3) return 'medium';
  return 'weak';
}

// ---------------------------------------------------------------
// ★ Phase G: 全体俯瞰型メロディ骨格設計（v3新設）
// ---------------------------------------------------------------

/**
 * G1: コード進行タイプを自動判定する
 *
 * chordNames をキーからの度数列（PC差）に変換し、
 * 15種類の進行パターンと照合する。
 * 一致した進行タイプに応じて:
 *   - フォルム形状 (form)
 *   - テンション配置 (tensionMeasures: 頂点になる小節リスト)
 *   - 推奨モチーフ方向 (motifShape)
 * を返す。
 *
 * @param {string[]} chordNames  コード進行
 * @param {string}   key         キー名
 * @returns {{ type:string, form:string, tensionMeasures:number[], motifShape:string }}
 */
function _classifyProgression(chordNames, key) {
  const keyDef = KEY_DEFS.find(d => d.key === key);
  const ki     = keyDef ? keyDef.idx : 0;

  // 各コードのルートPCをキーからの度数（半音差）に変換
  const degrees = chordNames.map(c => {
    const s = getChordStructure(c);
    if (!s) return -1;
    return (s.rootPc - ki + 12) % 12;
  });

  // 進行パターン定義
  // deg: 度数列（0=I, 2=II, 4=III, 5=IV, 7=V, 9=VI, 11=VII）
  const PATTERNS = [
    // ─ 日本のポップ定番 ─
    { type: 'oh_well',     deg:[0,7,9,5],  form:'arch',   motifShape:'arch_gentle',  label:'王道進行(I-V-VIm-IV)' },
    { type: 'komuro',      deg:[9,5,0,7],  form:'valley', motifShape:'valley_leap',  label:'小室進行(VIm-IV-I-V)' },
    { type: 'pachelbel',   deg:[0,7,4,9,5,0,5,7], form:'down', motifShape:'fall_cascade', label:'カノン進行' },
    { type: 'pop_minor',   deg:[9,7,0,7],  form:'valley', motifShape:'valley_step',  label:'マイナーポップ(VIm-V-I-V)' },
    { type: 'four_chord',  deg:[0,5,7,5],  form:'arch',   motifShape:'rise_penta',   label:'4コード(I-IV-V-IV)' },
    // ─ ジャズ・洒落た進行 ─
    { type: 'two_five_one', deg:[2,7,0,0], form:'down',   motifShape:'fall_resolve', label:'II-V-I' },
    { type: 'one_six',     deg:[0,9,5,7],  form:'arch',   motifShape:'arch_short',   label:'I-VIm-IV-V' },
    { type: 'jazz_minor',  deg:[9,2,7,0],  form:'valley', motifShape:'turn',         label:'VIm-IIm-V-I' },
    // ─ ブルース ─
    { type: 'blues',       deg:[0,5,7,0],  form:'valley', motifShape:'neighbor_up',  label:'ブルース(I-IV-V)' },
    { type: 'blues12',     deg:[0,0,0,0,5,5,0,0,7,5,0,7], form:'valley', motifShape:'neighbor_up', label:'12barブルース' },
    // ─ フォーク・シンプル ─
    { type: 'folk_up',     deg:[0,2,4,5],  form:'up',     motifShape:'rise_step',    label:'上昇フォーク(I-II-III-IV)' },
    { type: 'folk_down',   deg:[0,7,5,4],  form:'down',   motifShape:'fall_step',    label:'下降フォーク(I-V-IV-III)' },
    // ─ バラード ─
    { type: 'ballad_main', deg:[0,9,5,7],  form:'arch',   motifShape:'arch_leap',    label:'バラード王道' },
    { type: 'ballad_fall', deg:[0,11,9,7], form:'down',   motifShape:'fall_cascade', label:'クリシェ下降' },
    // ─ デフォルト ─
    { type: 'generic',     deg:[],         form:'arch',   motifShape:'arch_gentle',  label:'その他' },
  ];

  // [P2-2] 終止形パターン定義（最後の2コードで照合）
  // cadenceScore: 終止形が一致したときのスコア加算量
  const CADENCE_PATTERNS = [
    { degs: [7, 0],  score: 30, label: '完全終止(V-I)' },
    { degs: [2, 7, 0], score: 35, label: 'II-V-I終止' },
    { degs: [5, 0],  score: 20, label: '下属終止(IV-I)' },
    { degs: [7, 9],  score: 15, label: '偽終止(V-VIm)' },
    { degs: [5, 7],  score: 10, label: '半終止(IV-V)' },
  ];

  // 度数の近似一致判定（±1半音 または 11半音差を許容）
  function degMatch(a, b) {
    if (a < 0) return false;
    return Math.abs(a - b) <= 1 || Math.abs(a - b) === 11;
  }

  // 終止形スコアを計算する
  function calcCadenceScore(patDeg) {
    let cadScore = 0;
    for (const cad of CADENCE_PATTERNS) {
      const n = cad.degs.length;
      if (degrees.length < n) continue;
      const tail = degrees.slice(-n);
      if (cad.degs.every((d, i) => degMatch(tail[i], d))) {
        cadScore = Math.max(cadScore, cad.score);
      }
    }
    return cadScore;
  }

  // 全体n-gram一致スコア: パターン全体に対する一致度（0〜1）× 20
  function calcNgramScore(patDeg) {
    if (patDeg.length === 0) return 0;
    const checkLen = Math.min(patDeg.length, degrees.length);
    let matches = 0;
    for (let i = 0; i < checkLen; i++) {
      if (degMatch(degrees[i], patDeg[i])) matches++;
    }
    return (matches / checkLen) * 20;
  }

  const n = Math.min(degrees.length, 8);

  // ── 第1フェーズ: 先頭一致で候補を絞り込む ──
  const candidates = [];
  for (const pat of PATTERNS) {
    if (pat.deg.length === 0) continue;
    const checkLen = Math.min(pat.deg.length, n);
    const headMatch = pat.deg.slice(0, checkLen).every((d, i) => degMatch(degrees[i], d));
    if (headMatch) {
      candidates.push(pat);
    }
  }

  // 候補が1つなら即返す（従来どおり高速パス）
  if (candidates.length === 1) return candidates[0];

  // ── 第2フェーズ: 候補が複数 or ゼロ → スコアリングで決定 ──
  const scoredPatterns = (candidates.length > 0 ? candidates : PATTERNS.filter(p => p.deg.length > 0))
    .map(pat => {
      const headScore   = calcNgramScore(pat.deg);
      const cadScore    = calcCadenceScore(pat.deg);
      const total       = headScore + cadScore;
      return { pat, total };
    });

  scoredPatterns.sort((a, b) => b.total - a.total);

  // スコア最大のパターンを返す（同点ならリスト順で先のものを優先）
  if (scoredPatterns.length > 0 && scoredPatterns[0].total > 0) {
    return scoredPatterns[0].pat;
  }

  return PATTERNS.find(p => p.type === 'generic');
}

/**
 * G1.5: コード進行からフレーズ長を推定する。[可変フレーズ化]
 *
 * 推定ロジック（優先順）:
 *   1. 終止形検出: V→I / IV→I / II-V-I 等の終止形が現れる周期を検出
 *   2. コード繰り返し: 同じコード列が繰り返される場合、その単位長を採用
 *   3. コード変化密度: 総コード数が少ない(≦3)→2、多い(≧9)→4にクランプ
 *   4. デフォルト: 4
 *
 * @param {string[]} chordNames  コード進行
 * @param {string}   key         キー名
 * @returns {number[]}  各フレーズの長さの配列 (例: [4,4,4,4] or [3,3,2] など)
 */
function _estimatePhraseLen(chordNames, key) {
  const total = chordNames.length;
  if (total <= 2) return [total];

  const keyDef = KEY_DEFS.find(d => d.key === key);
  const ki     = keyDef ? keyDef.idx : 0;

  // 度数列に変換（解析失敗は-1）
  const degs = chordNames.map(c => {
    const s = getChordStructure(c);
    return s ? (s.rootPc - ki + 12) % 12 : -1;
  });

  // ── 1. 終止形周期の検出 ──
  // V→I (7→0), IV→I (5→0), II-V-I の "→I" の位置を終止点候補とする
  const cadencePositions = [];
  for (let i = 1; i < total; i++) {
    const prev = degs[i - 1], cur = degs[i];
    if (cur === 0 && (prev === 7 || prev === 5)) {
      cadencePositions.push(i); // I に解決した小節インデックス
    }
    // II-V-I の V→I
    if (cur === 0 && prev === 7 && i >= 2 && degs[i - 2] === 2) {
      cadencePositions.push(i);
    }
  }
  // 重複除去・ソート
  const uniqCad = [...new Set(cadencePositions)].sort((a, b) => a - b);

  if (uniqCad.length >= 2) {
    // 終止間隔の最頻値をフレーズ長の候補にする
    const intervals = [];
    let prev = -1;
    for (const pos of uniqCad) {
      if (prev >= 0) intervals.push(pos - prev);
      prev = pos;
    }
    // 最頻値
    const freq = {};
    intervals.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
    const modalLen = Object.entries(freq).sort((a, b) => b[1] - a[1])[0]?.[0];
    const len = parseInt(modalLen, 10);
    if (len >= 2 && len <= 8) {
      // 終止位置でフレーズを区切る
      return _buildPhraseLensFromBoundaries(uniqCad, total, len);
    }
  }

  // ── 2. コード列の繰り返し検出 ──
  // 前半N小節と後半N小節が一致する最小Nを探す
  for (let n = 2; n <= Math.floor(total / 2); n++) {
    const first = chordNames.slice(0, n).join(',');
    const second = chordNames.slice(n, n * 2).join(',');
    if (first === second) {
      return _buildPhraseLensFromPeriod(n, total);
    }
  }

  // ── 3. コード変化密度によるクランプ ──
  const uniqueChords = new Set(chordNames).size;
  let defaultLen = 4;
  if (uniqueChords <= 2)      defaultLen = 2;
  else if (uniqueChords <= 3) defaultLen = 3; // 3コード進行（フォーク等）
  else if (total >= 9)        defaultLen = 4;

  return _buildPhraseLensFromPeriod(defaultLen, total);
}

/** 終止位置配列からフレーズ長配列を生成する */
function _buildPhraseLensFromBoundaries(cadPositions, total, hintLen) {
  const phraseLens = [];
  let start = 0;
  // 終止位置（含む）までを1フレーズとする
  for (const pos of cadPositions) {
    const len = pos - start + 1;
    if (len > 0) phraseLens.push(len);
    start = pos + 1;
  }
  // 残り
  if (start < total) phraseLens.push(total - start);
  // 長すぎるフレーズはhintLenで分割
  const result = [];
  for (const l of phraseLens) {
    if (l > hintLen * 2) {
      let rem = l;
      while (rem > 0) {
        result.push(Math.min(hintLen, rem));
        rem -= hintLen;
      }
    } else {
      result.push(l);
    }
  }
  return result.filter(l => l > 0);
}

/** 固定周期からフレーズ長配列を生成する */
function _buildPhraseLensFromPeriod(period, total) {
  const result = [];
  let rem = total;
  while (rem > 0) {
    result.push(Math.min(period, rem));
    rem -= period;
  }
  return result;
}

/**
 * _getPhraseContext: 小節インデックスmi からフレーズ情報を一元取得する。[可変フレーズ化]
 *
 * skeleton の phraseBoundaries（各フレーズの [start, end] 配列）を参照し、
 * mi が属するフレーズの情報をまとめて返す。
 *
 * @param {number} mi        小節インデックス
 * @param {number} total     総小節数
 * @param {Object} skeleton  _buildMelodySkeleton の返り値（phraseBoundariesを含む）
 * @returns {{
 *   phraseIdx:    number,   // フレーズ番号（0始まり）
 *   phraseLen:    number,   // このフレーズの長さ
 *   phraseTotal:  number,   // このフレーズの実際の小節数（末尾フレーズは短い場合あり）
 *   posInPhrase:  number,   // フレーズ内の絶対位置（0始まり）
 *   posRatio:     number,   // フレーズ内の正規化比率（0.0〜1.0）
 *   role:         string,   // 'intro'|'develop'|'climax'|'resolve'
 *   phraseCount:  number,   // 総フレーズ数
 * }}
 */
function _getPhraseContext(mi, total, skeleton) {
  const boundaries = skeleton?.phraseBoundaries;

  // skeleton未設定のフォールバック（旧来の4小節固定）
  if (!boundaries || boundaries.length === 0) {
    const phraseLen   = 4;
    const phraseIdx   = Math.floor(mi / phraseLen);
    const posInPhrase = mi % phraseLen;
    const phraseTotal = Math.min(phraseLen, total - phraseIdx * phraseLen);
    const posRatio    = posInPhrase / Math.max(phraseTotal - 1, 1);
    const role        = _posRatioToRole(posRatio, posInPhrase, phraseTotal);
    return { phraseIdx, phraseLen, phraseTotal, posInPhrase, posRatio, role,
             phraseCount: Math.ceil(total / phraseLen) };
  }

  // phraseBoundaries = [{start, end, len}, ...] 配列で境界を引く
  for (let pi = 0; pi < boundaries.length; pi++) {
    const { start, end, len } = boundaries[pi];
    if (mi >= start && mi <= end) {
      const phraseTotal  = end - start + 1;
      const posInPhrase  = mi - start;
      const posRatio     = posInPhrase / Math.max(phraseTotal - 1, 1);
      const role         = _posRatioToRole(posRatio, posInPhrase, phraseTotal);
      return { phraseIdx: pi, phraseLen: len, phraseTotal, posInPhrase,
               posRatio, role, phraseCount: boundaries.length };
    }
  }

  // 範囲外（末尾小節の場合など）→ 最後のフレーズ末として扱う
  const last = boundaries[boundaries.length - 1];
  return { phraseIdx: boundaries.length - 1, phraseLen: last.len,
           phraseTotal: last.end - last.start + 1,
           posInPhrase: last.end - last.start,
           posRatio: 1.0, role: 'resolve',
           phraseCount: boundaries.length };
}

/**
 * 正規化比率とフレーズ長から役割を判定する。
 * 比率を4段階ロール（intro/develop/climax/resolve）にマッピング。
 * フレーズ長に依存せず比率で判定するのがポイント。
 */
function _posRatioToRole(posRatio, posInPhrase, phraseTotal) {
  if (phraseTotal <= 2) {
    return posInPhrase === 0 ? 'intro' : 'resolve';
  }
  if (phraseTotal === 3) {
    if (posInPhrase === 0) return 'intro';
    if (posInPhrase === 1) return 'climax';
    return 'resolve';
  }
  // 4小節以上: 比率で4段階に分割
  if (posRatio < 0.25)       return 'intro';
  if (posRatio < 0.55)       return 'develop';
  if (posRatio < 0.80)       return 'climax';
  return 'resolve';
}

/**
 * G2: 全体フォルムから、各小節の「目標MIDI」テーブルを生成する。[可変フレーズ化対応]
 *
 * フォルム形状（arch/up/down/valley）に従い、全小節分の
 * targetMidi配列を返す。各小節のメロディ生成はこの値を参照する。
 *
 * @param {string}   form         'arch'|'up'|'down'|'valley'
 * @param {number}   total        総小節数
 * @param {number}   lo           音域下限MIDI
 * @param {number}   hi           音域上限MIDI
 * @param {number[]} tensionMiArr テンション配置ヒント（省略可）
 * @param {number[]} phraseLens   フレーズ長配列（省略時は[4,4,...]）
 * @returns {{ targets, phraseBoundaries, peakMeasures, isQuestionPhrase }}
 */
function _buildMelodySkeleton(form, total, lo, hi, tensionMiArr = [], phraseLens = null) {
  const targets      = [];
  const peakMeasures = [];

  // フレーズ境界テーブルを構築
  const resolvedLens = phraseLens && phraseLens.length > 0
    ? phraseLens
    : _buildPhraseLensFromPeriod(4, total);

  // phraseBoundaries: [{start, end, len}, ...]
  const phraseBoundaries = [];
  let cursor = 0;
  for (const len of resolvedLens) {
    const start = cursor;
    const end   = Math.min(cursor + len - 1, total - 1);
    phraseBoundaries.push({ start, end, len });
    cursor = end + 1;
    if (cursor >= total) break;
  }
  const phraseCount = phraseBoundaries.length;

  // phraseStarts（後方互換用）
  const phraseStarts = phraseBoundaries.map(b => b.start);

  const MID  = Math.round((lo + hi) / 2);
  const LOW  = lo  + Math.round((hi - lo) * 0.10);
  const HIGH = hi  - Math.round((hi - lo) * 0.10);

  for (let mi = 0; mi < total; mi++) {
    // _getPhraseContext を使って正規化比率を取得
    // (skeletonはまだ完成していないので phraseBoundaries を直接渡す仮骨格を使う)
    const tmpSkeleton = { phraseBoundaries };
    const ctx = _getPhraseContext(mi, total, tmpSkeleton);
    const { phraseIdx, posRatio, posInPhrase, phraseTotal, role } = ctx;

    const t           = posRatio;
    const phaseOffset = (phraseIdx % 2 === 1) ? 0.15 : 0;
    const isLastPhrase = phraseIdx === phraseCount - 1;

    let target;

    switch (form) {
      case 'arch': {
        const tAdj = t + phaseOffset;
        const arch = 4 * tAdj * (1 - tAdj);
        target = Math.round(LOW + arch * (HIGH - LOW));
        if (role === 'develop' || role === 'climax') peakMeasures.push(mi);
        break;
      }
      case 'up': {
        if (isLastPhrase && posInPhrase >= phraseTotal - 2) {
          target = MID;
        } else {
          target = Math.round(LOW + t * (HIGH - LOW));
        }
        if (role === 'climax') peakMeasures.push(mi);
        break;
      }
      case 'down': {
        const isFirstPhrase = phraseIdx === 0;
        const startPoint = isFirstPhrase ? HIGH : Math.round(MID + (HIGH - MID) * 0.5);
        target = Math.round(startPoint - t * (startPoint - LOW));
        if (role === 'intro') peakMeasures.push(mi);
        break;
      }
      case 'valley': {
        const valley = 1 - 4 * (t - 0.5) * (t - 0.5);
        target = Math.round(HIGH - valley * (HIGH - LOW));
        if (role === 'intro' || role === 'resolve') peakMeasures.push(mi);
        break;
      }
      default:
        target = MID;
    }

    if (tensionMiArr.includes(mi) && mi !== total - 1) {
      target = Math.min(target + 2, HIGH);
    }

    // γ: 問いと答えの構造（フレーズ末のみ）
    const isQuestion   = phraseIdx % 2 === 0;
    const isPhraseLast = role === 'resolve';
    if (isPhraseLast && mi !== total - 1) {
      target = isQuestion ? MID + 3 : LOW + 1;
    }
    if (mi === total - 1) target = LOW + 1;

    targets.push(Math.max(lo, Math.min(hi, target)));
  }

  // 問い/答え判定関数（_getPhraseContextを使う形に更新）
  const isQuestionPhrase = (mi) => {
    const ctx = _getPhraseContext(mi, total, { phraseBoundaries });
    return ctx.phraseIdx % 2 === 0;
  };

  return { targets, phraseStarts, phraseBoundaries, peakMeasures, isQuestionPhrase };
}

// ---------------------------------------------------------------
// Phase 3 ③：最近接音選択
// ---------------------------------------------------------------

function _pickNearest(pool, targetMidi, excludeMidis = []) {
  const excSet   = new Set(excludeMidis.filter(m => m !== null && m !== undefined));
  const filtered = pool.filter(e => !excSet.has(e.midi));
  const src      = filtered.length > 0 ? filtered : pool;

  const _rng = (typeof window !== 'undefined' && window._soloRng)
    ? window._soloRng : Math.random;

  let best = src[0];
  let bestDist = Math.abs(src[0].midi - targetMidi);
  for (let i = 1; i < src.length; i++) {
    const d = Math.abs(src[i].midi - targetMidi);
    if (d < bestDist || (d === bestDist && _rng() < 0.5)) {
      best = src[i];
      bestDist = d;
    }
  }
  return best;
}

// ---------------------------------------------------------------
// Phase 3 ④：音高列をリズムにはめてNoteEvent列を作る
// ---------------------------------------------------------------

function _fitToRhythm(pool, durs) {
  const events = []; let beat = 1;
  durs.forEach((dur, i) => {
    const item = pool.length > 0 ? pool[i % pool.length] : null;
    events.push(makeNoteEvent(item ? item.midi : -1, dur, beat,
                              item ? item.role : 'rest'));
    beat += dur;
  });
  return events;
}

// ---------------------------------------------------------------
// モチーフ生成ユーティリティ
// ---------------------------------------------------------------

function _buildMotif(startMidi, intervals, scalePool) {
  const scaleMidis = new Set(scalePool.map(e => e.midi));
  const result = [];
  let cur = startMidi;

  intervals.forEach(interval => {
    cur += interval;
    if (!scaleMidis.has(cur)) {
      // スケール吸着: ±2半音以内で探す（遠すぎる吸着を防ぐ）
      const nearby = scalePool.filter(e => Math.abs(e.midi - cur) <= 2);
      const snap = (nearby.length > 0 ? nearby : scalePool).reduce((best, e) =>
        Math.abs(e.midi - cur) < Math.abs(best.midi - cur) ? e : best
      , scalePool[0]);
      cur = snap.midi;
    }
    const found = scalePool.find(e => e.midi === cur);
    result.push(found ?? { midi: cur, role: 'passing' });
  });

  return result;
}

function _clipMotifToRange(notes, lo, hi, scalePool) {
  return notes.map(e => {
    if (e.midi >= lo && e.midi <= hi) return e;
    let adjusted = e.midi;
    while (adjusted < lo)  adjusted += 12;
    while (adjusted > hi)  adjusted -= 12;
    const snap = scalePool.reduce((best, s) =>
      Math.abs(s.midi - adjusted) < Math.abs(best.midi - adjusted) ? s : best
    , scalePool[0]);
    return snap;
  });
}

 *
 * 旧来の問題:

 *   音楽理論上、モチーフは「音程パターン＋リズムパターン」の組み合わせで
 *   初めて「覚えられる・歌えるフレーズ」になる。
