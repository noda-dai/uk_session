<script>
// ===================================================================
// session_ui.txt  — SessionSpace UI描画・インタラクション  v5
//
// v4 → v5 の変更:
//   [Feature-3] 選択式おすすめフレーズ（機能③）を追加。
//                 アシストレベルが 'beginner'（ASSIST_LEVELS.beginner.showPhrases）
//                 のときのみ、短尺フレーズ候補を2〜3種類表示する。
//                 生成本体は session_phrase_suggest.txt の suggestShortPhrases() /
//                 drawPhraseCard() に委譲し、session_ui.txt 側は
//                 onMeasureChange への配線と、フレーズ生成に渡す材料
//                 （パートナー占有音域・前フレーズ終止音等）の受け渡しのみを担う。
//                 find_space モードでは機能②と同様に強制非表示にする。
//
// v3 → v4 の変更:
//   [Feature-2/4] リアルタイム指板ガイド（機能②）とアシストレベル（機能④）を追加。
//                   ssMode（練習の形式）とは独立した ssAssistLevel を新設し、
//                   'beginner'/'normal' では指板ガイドを表示、'hard' では非表示にする。
//                   ただし find_space モード（隙間を探せ）選択中は、
//                   耳で空きを探す訓練という目的と矛盾するため、
//                   アシストレベルの設定に関わらず強制的に非表示にする。
//                   描画本体は session_fretboard_guide.txt の
//                   buildFretboardGuideMap() / drawFretboardGuide() に委譲し、
//                   session_ui.txt 側は onMeasureChange への配線のみを担う。
//
// v2 → v3 の変更:
//   [Tab-Split]   セットアップパネルを2タブに再構成する。
//                   タブ①「コード進行で作る」: 旧「かんたんスタート」+
//                     「詳細設定」を統合（アコーディオンは廃止し1画面に集約）。
//                   タブ②「MIDIをインポート」: 分離。キー/コード進行/ジャンルの
//                     編集UIは表示せず、ウクレレ最適化モード固定である旨を明示する。
//                   楽器選択・練習モード・役割分担はどちらのタブでも使うため、
//                   タブの外（共通エリア）に配置する。
//   [Fix-GenreChords] ジャンル選択時、テンポだけでなくコード進行も
//                   ジャンルに応じて変化するよう修正。
//                   旧実装は常に固定の1パターン（王道進行）のみを使っており、
//                   ジャンルを切り替えてもコード進行が一切変わらないバグがあった。
//                   js_data_genre_patch.txt の expandProgressionForGenre() を用いて、
//                   ジャンルごとの展開戦略（ブルース=12小節、ジャズ=develop 等）を適用する。
//   [Fix-MidiPreview] MIDIファイル選択の時点で importFromMidi() を実行し、
//                   検出されたキー・コード進行・テンポをその場でプレビュー表示する。
//                   旧実装は「セッション開始」を押すまで解析されず、
//                   開始後に ssKey 等の内部変数だけが書き換わり画面表示とズレる
//                   問題があった。解析結果はキャッシュして開始時に再利用し、
//                   二重パースも回避する。
//   [Fix-Complexity]  MIDIインポート時、演奏スタイル（複雑度）が初回生成では
//                   無視され、バトンタッチで役割交代した瞬間にしか反映されない
//                   バグを修正。buildPartnerScore と同じ applySubtractionVoicing()
//                   をMIDIパスの初回生成時にも適用する。
//   [Fix-ActivePath] 「MIDIを読み込んだ後にコード進行欄を編集しても、
//                   開始時は依然MIDIが優先される」という気づきにくい不整合を解消。
//                   どちらの生成パイプラインを使うかは ssActiveTab（明示的なタブ選択）
//                   だけで決まるようにした。
//   [Fix-StartGuard] コード進行/MIDI未設定のまま開始してアラートで弾かれる
//                   体験を改め、開始ボタン自体を条件未成立の間は非活性化する。
//
// 依存:
//   session_data.txt   — INSTRUMENT_PROFILES, SESSION_ROLES,
//                        SESSION_MODES, COMPLEXITY_PRESETS, FREQ_VIZ,
//                        ASSIST_LEVELS  [Feature-2/4]
//   session_engine.txt — buildPartnerScore, buildFreqBands,
//                        generateSpaceHint, buildBatonSchedule,
//                        resolveRoleMutex, applySubtractionVoicing
//   session_player.txt — sessionPlayerPlay, sessionPlayerStop,
//                        sessionPlayerPause, sessionPlayerSetTempo,
//                        sessionPlayerSeek, sessionPlayerSeekToMeasure,
//                        SessionPlayer
//   js_scoreImport.txt — importFromMidi, buildSoloScoreFromImport
//   js_data_genre_patch.txt      — expandProgressionForGenre  [Fix-GenreChords]
//   session_fretboard_guide.txt  — buildFretboardGuideMap, drawFretboardGuide
//                        [Feature-2/4]
//   session_phrase_suggest.txt   — suggestShortPhrases, drawPhraseCard
//                        [Feature-3]
// ===================================================================

// ---------------------------------------------------------------
// セッション状態変数
// ---------------------------------------------------------------

let ssKey              = 'C';
let ssGenre            = 'pop';
let ssChords           = ['C', 'Am', 'F', 'G'];
let ssUserInstrument   = 'ukulele_high_g';
let ssPartnerInstrument= 'ukulele_low_g';
let ssUserRole         = 'MELODY_HIGH';
let ssPartnerRole      = 'CHORD_COMP';
let ssComplexity       = 'standard';
let ssMode             = 'free';
let ssBatonEvery       = 4;
let ssCurrentScore     = null;
let ssCurrentMeasure   = 0;
let ssTempo            = 100;   // UI管理テンポ（スライダーと同期）

// [Tab-Split] どちらのタブがアクティブか。生成パイプラインの選択に使う唯一の情報源。
let ssActiveTab        = 'chords';  // 'chords' | 'midi'

// [Fix-MidiPreview] ファイル選択時点で解析したMIDI情報（ImportResult）をキャッシュする。
// セッション開始時もこれを再利用し、二重パースと表示ズレを防ぐ。
let ssMidiPreview      = null;
let ssMidiFileName     = null;

// [Feature-2/4] リアルタイム指板ガイドのアシストレベル。
// ssMode（練習の形式）とは独立した別軸の状態として持つ。
let ssAssistLevel      = 'normal';  // 'beginner' | 'normal' | 'hard'

// [Feature-3] 直前に提示したフレーズの終止音。
// 次の小節のフレーズ生成時に開始点として渡すことで、
// フレーズ間の突飛な跳躍を減らす（曲全体設計の代わりの簡易策）。
let _ssPrevPhraseEndMidi = null;

// ---------------------------------------------------------------
// エントリポイント：セッションパネルの初期描画
// ---------------------------------------------------------------

function sessionInit() {
  _ssRenderSetupPanel();
  _ssRenderFreqViz(null, -1);        // 空の帯域メーターを表示
  _ssRenderFretboardGuide(null, 0);  // 空の指板ガイドを表示
  _ssRenderPhraseSuggestions(null, 0); // フレーズ提案セクションの表示/非表示を初期化
}

// ---------------------------------------------------------------
// セットアップパネル（全体構成）
// ---------------------------------------------------------------

function _ssRenderSetupPanel() {
  const wrap = document.getElementById('ss-setup');
  if (!wrap) return;

  wrap.innerHTML = `
    <div id="ss-tabs" style="display:flex;gap:6px;margin-bottom:14px;
                border-bottom:1px solid var(--border);padding-bottom:10px">
      <button class="ss-btn ${ssActiveTab === 'chords' ? 'active' : ''}"
              onclick="ssSwitchTab('chords')">🎼 コード進行で作る</button>
      <button class="ss-btn ${ssActiveTab === 'midi' ? 'active' : ''}"
              onclick="ssSwitchTab('midi')">📂 MIDIをインポート</button>
    </div>

    <div id="ss-tab-content">
      ${ssActiveTab === 'midi' ? _ssRenderMidiTabHTML() : _ssRenderChordsTabHTML()}
    </div>

    <div id="ss-common-controls">
      ${_ssRenderCommonControlsHTML()}
    </div>

    <div style="text-align:center;margin-top:6px">
      <button id="ss-start-btn" class="ss-primary-btn" onclick="ssStart()">
        ▶ セッション開始
      </button>
    </div>`;

  _ssUpdateStartButtonState();
}

/**
 * タブ切り替え。タブボタン自体のハイライトも変わるため全体を再描画する。
 */
function ssSwitchTab(tab) {
  if (ssActiveTab === tab) return;
  ssActiveTab = tab;
  _ssRenderSetupPanel();
}

/**
 * タブ内コンテンツのみを差し替える軽量更新。
 * 楽器選択・役割分担・練習モード（共通エリア）やタブボタン自体には触れない。
 */
function _ssRefreshTabContent() {
  const el = document.getElementById('ss-tab-content');
  if (el) el.innerHTML = ssActiveTab === 'midi' ? _ssRenderMidiTabHTML() : _ssRenderChordsTabHTML();
  _ssUpdateStartButtonState();
}

/**
 * 共通エリア（楽器・練習モード・役割分担）のみを差し替える軽量更新。
 */
function _ssRefreshCommonControls() {
  const el = document.getElementById('ss-common-controls');
  if (el) el.innerHTML = _ssRenderCommonControlsHTML();
}

// ---------------------------------------------------------------
// 開始ボタンの活性化制御  [Fix-StartGuard]
// ---------------------------------------------------------------

function _ssCanStart() {
  if (ssActiveTab === 'midi') return !!ssMidiPreview;
  return !!(ssChords && ssChords.length > 0);
}

function _ssUpdateStartButtonState() {
  const btn = document.getElementById('ss-start-btn');
  if (!btn) return;
  const ok = _ssCanStart();
  btn.disabled     = !ok;
  btn.style.opacity = ok ? '1' : '0.45';
  btn.style.cursor  = ok ? 'pointer' : 'not-allowed';
  btn.title = ok ? '' : (ssActiveTab === 'midi'
    ? 'MIDIファイルを読み込んでください'
    : 'コード進行を入力してください');
}

// ---------------------------------------------------------------
// タブ①: コード進行で作る
// ---------------------------------------------------------------

function _ssRenderChordsTabHTML() {
  const genreBtns = Object.entries(GENRE_PRESETS).map(([k, v]) =>
    `<button class="ss-btn ${ssGenre === k ? 'active' : ''}"
             onclick="ssSetGenreQuick('${k}')"
             title="${v.desc ?? ''}">
       ${v.emoji ?? ''} ${v.label}
     </button>`
  ).join('');

  return `
    <div class="ss-setup-block">
      <div class="ss-label">スタイルを選ぶ（コード進行・テンポも自動で切り替わります）</div>
      <div class="ss-btn-row" style="flex-wrap:wrap">${genreBtns}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:5px">
        ${GENRE_PRESETS[ssGenre]?.desc ?? ''}
        ${GENRE_PRESETS[ssGenre]?.recommendedChords
          ? `　推奨コード数: <strong>${GENRE_PRESETS[ssGenre].recommendedChords}個</strong>`
          : ''}
      </div>
    </div>

    <div class="ss-setup-grid" style="margin-top:14px">

      <div class="ss-setup-block">
        <div class="ss-label">キー</div>
        <div class="ss-btn-row" style="flex-wrap:wrap">
          ${['C','D','E','F','G','A','B','Bb'].map(k =>
            `<button class="ss-btn ${ssKey === k ? 'active' : ''}"
                     onclick="ssSetKey('${k}')">${k}</button>`
          ).join('')}
        </div>
      </div>

      <div class="ss-setup-block">
        <div class="ss-label">コード進行</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
          ${(typeof PROGRESSIONS !== 'undefined' && PROGRESSIONS[ssKey]
            ? PROGRESSIONS[ssKey] : []
          ).map(p => {
            const isSelected = ssChords.join(' ') === p.chords.join(' ');
            return `<button class="ss-btn ${isSelected ? 'active' : ''}"
                      onclick="ssApplyProgression('${p.chords.join(',')}')"
                      title="${p.desc ?? ''}">${p.emoji ?? ''} ${p.label}</button>`;
          }).join('')}
        </div>
        ${(() => {
          const guide = GENRE_PRESETS[ssGenre];
          const rec   = guide?.recommendedChords;
          const cur   = ssChords.length;
          if (!rec || cur >= rec) return '';
          return `<div style="margin-bottom:6px">
            <button class="ss-btn" onclick="ssExpandChords()"
              style="background:var(--green-light);border-color:var(--green);color:var(--green)">
              ✨ ${guide.label}向けに${rec}コードへ拡張
            </button>
            <span style="font-size:11px;color:var(--text2);margin-left:6px">
              現在${cur}コード → ${rec}コード推奨
            </span></div>`;
        })()}
        <input type="text" id="ss-chord-text"
               value="${ssChords.join(' ')}"
               placeholder="例: C Am F G"
               style="width:100%;padding:6px 8px;border-radius:8px;
                      border:1px solid var(--border);
                      background:var(--surface);color:var(--text);
                      font-size:13px"
               oninput="ssSetChords(this.value)">
        <div style="font-size:10px;color:var(--text3);margin-top:3px">
          プリセットを選択するか、コード名をスペース区切りで直接入力
        </div>
      </div>

      <div class="ss-setup-block">
        ${_ssRenderComplexityHTML()}
      </div>

    </div>`;
}

// ---------------------------------------------------------------
// タブ②: MIDIをインポート
// ---------------------------------------------------------------

function _ssRenderMidiTabHTML() {
  const hasPreview    = !!ssMidiPreview;
  const partnerLabel  = INSTRUMENT_PROFILES[ssPartnerInstrument]?.label ?? 'パートナー';

  const previewHTML = hasPreview ? `
    <div style="margin-top:10px;padding:10px 12px;background:var(--green-light);
                border:1px solid var(--green);border-radius:10px;font-size:12px;line-height:1.8">
      <div style="font-weight:700;color:var(--green);margin-bottom:4px">
        ✅ ${_escHtml(ssMidiFileName ?? 'MIDIファイル')} を解析しました
      </div>
      <div>検出されたキー: <strong>${ssMidiPreview.key}</strong></div>
      <div>検出されたコード進行（先頭8小節・自動推定）:<br>
        <strong>${ssMidiPreview.measures.slice(0, 8).map(m => m.chord).join(' - ')}${ssMidiPreview.measures.length > 8 ? ' …' : ''}</strong>
        <span style="color:var(--text2)">（全${ssMidiPreview.measures.length}小節）</span>
      </div>
      <div>テンポ: <strong>${ssMidiPreview.tempo} BPM</strong>（自動検出）</div>
      ${ssMidiPreview.warnings?.length ? `
        <div style="margin-top:6px;color:var(--amber)">
          ${ssMidiPreview.warnings.map(w => `⚠️ ${_escHtml(w)}`).join('<br>')}
        </div>` : ''}
      <button class="ss-btn" onclick="ssClearMidi()" style="margin-top:8px">MIDIを取り消す</button>
    </div>` : '';

  return `
    <div style="margin-bottom:10px;padding:10px 12px;background:var(--amber-light);
                border:1px solid var(--amber);border-radius:10px;font-size:12px;line-height:1.7">
      🎸 <strong>MIDIインポートは常にウクレレ最適化モードで変換されます。</strong><br>
      原曲を忠実に再現するのではなく、メロディと伴奏を自動で聴き分け、
      ${_escHtml(partnerLabel)}で弾きやすいフレット位置・音数に調整し直したタブ譜が生成されます。
      キー・コード進行・テンポはMIDIファイルから自動検出され、このタブでは編集できません。
    </div>

    <label class="ss-file-btn">
      📂 MIDIファイルを読み込む
      <input type="file" accept=".mid,.midi" onchange="ssHandleMidiFile(event)" style="display:none">
    </label>
    <div id="ss-midi-status" style="font-size:11px;color:var(--text2);margin-top:4px"></div>

    ${previewHTML}

    <div class="ss-setup-block" style="margin-top:14px">
      ${_ssRenderComplexityHTML()}
    </div>`;
}

/**
 * 演奏スタイル（複雑度）セレクタ。両タブで共通に使う部品。
 * [Fix-Complexity] MIDIモードでも初回生成から効くようになったため、両タブに表示する。
 */
function _ssRenderComplexityHTML() {
  return `
    <div class="ss-label">あなたの演奏スタイル</div>
    <div class="ss-btn-row">
      ${Object.entries(COMPLEXITY_PRESETS).map(([k, v]) =>
        `<button class="ss-btn ${ssComplexity === k ? 'active' : ''}"
                 onclick="ssSetComplexity('${k}')"
                 title="${v.desc}">${v.label}</button>`
      ).join('')}
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:4px">
      ${COMPLEXITY_PRESETS[ssComplexity].partnerDesc}
    </div>`;
}

// ---------------------------------------------------------------
// 共通エリア: 楽器選択・練習モード・役割分担
// ---------------------------------------------------------------

function _ssRenderCommonControlsHTML() {
  const rolePanelHTML = _ssBuildRolePanelHTML();

  return `
    <div class="ss-setup-grid" style="margin-top:6px">

      <div class="ss-setup-block">
        <div class="ss-label">あなたの楽器</div>
        <div class="ss-btn-row">
          ${['ukulele_high_g','ukulele_low_g'].map(k => {
            const v = INSTRUMENT_PROFILES[k];
            return `<button class="ss-btn ${ssUserInstrument === k ? 'active' : ''}"
                     onclick="ssSetUserInstrument('${k}')">${v.emoji} ${v.label}</button>`;
          }).join('')}
        </div>
      </div>

      <div class="ss-setup-block">
        <div class="ss-label">パートナーの楽器</div>
        <div class="ss-btn-row">
          ${['ukulele_high_g','ukulele_low_g'].map(k => {
            const v = INSTRUMENT_PROFILES[k];
            return `<button class="ss-btn ${ssPartnerInstrument === k ? 'active' : ''}"
                     onclick="ssSetPartnerInstrument('${k}')">${v.emoji} ${v.label}</button>`;
          }).join('')}
        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:4px">
          ${ssPartnerInstrument === 'ukulele_low_g'
            ? 'Low-Gはベースラインも担当できます。'
            : 'High-Gは標準チューニング。'}
        </div>
      </div>

      <div class="ss-setup-block">
        <div class="ss-label">練習モード</div>
        <div class="ss-btn-row">
          ${Object.entries(SESSION_MODES).map(([k, v]) =>
            `<button class="ss-btn ${ssMode === k ? 'active' : ''}"
                     onclick="ssSetMode('${k}')"
                     title="${v.desc}">${v.emoji} ${v.label}</button>`
          ).join('')}
        </div>
        <div id="ss-mode-desc" style="font-size:11px;color:var(--text2);margin-top:4px">
          ${SESSION_MODES[ssMode].desc}
        </div>
        <div id="ss-baton-row" style="display:${ssMode === 'baton_touch' ? 'flex' : 'none'};
             align-items:center;gap:8px;margin-top:6px">
          <span style="font-size:12px">切り替え間隔：</span>
          ${[2, 4, 8].map(n =>
            `<button class="ss-btn ${ssBatonEvery === n ? 'active' : ''}"
                     onclick="ssBatonEvery=${n};_ssRefreshCommonControls()">${n}小節</button>`
          ).join('')}
        </div>
      </div>

      <div class="ss-setup-block">
        <div class="ss-label">🎯 アシストレベル</div>
        <div class="ss-btn-row">
          ${Object.entries(ASSIST_LEVELS).map(([k, v]) =>
            `<button class="ss-btn ${ssAssistLevel === k ? 'active' : ''}"
                     onclick="ssSetAssistLevel('${k}')"
                     title="${v.desc}">${v.emoji} ${v.label}</button>`
          ).join('')}
        </div>
        <div style="font-size:11px;color:var(--text2);margin-top:4px">
          ${ASSIST_LEVELS[ssAssistLevel]?.desc ?? ''}
          ${ssMode === 'find_space'
            ? '<br><span style="color:var(--orange)">※「隙間を探せ」モードでは、耳で探す訓練のため指板ガイドを表示しません</span>'
            : ''}
        </div>
      </div>

    </div>

    <div style="margin:16px 0 4px">
      <div class="ss-label" style="margin-bottom:8px">🎭 役割分担</div>
      <div id="ss-role-panel-inline">
        ${rolePanelHTML}
      </div>
    </div>`;
}

/**
 * 役割パネルのHTMLを文字列で構築（ss-common-controls 内の inline 版）
 */
function _ssBuildRolePanelHTML() {
  const userProf = INSTRUMENT_PROFILES[ssUserInstrument];
  const { partnerRole, warnings } = resolveRoleMutex(
    ssUserRole, ssUserInstrument, ssPartnerInstrument
  );
  ssPartnerRole = partnerRole;

  const userRoleInfo    = SESSION_ROLES[ssUserRole];
  const partnerRoleInfo = SESSION_ROLES[partnerRole];

  const ROLE_PLAYING_IMAGE = {
    MELODY_HIGH: {
      you:     'A弦の5〜12フレット付近で主旋律を弾く。最もよく聴こえる声部。',
      partner: 'コードを刻みながら低〜中音域で支える。',
      tip:     '単音でも成り立ちます。音を詰め込まず「間」を大切に。',
    },
    MELODY_MID: {
      you:     'E弦・C弦の中音域でオクターブ下のメロディや対旋律を弾く。',
      partner: '高音域でオブリガードや装飾を入れながら支える。',
      tip:     '主旋律より音数を減らして、ハモり感を出すとよい。',
    },
    CHORD_COMP: {
      you:     'コードトーンを1〜2音ずつ散らして弾く。',
      partner: '主旋律を弾く。あなたはその「土台」になる。',
      tip:     '拍頭だけ弾いて、残りは休む — それが引き算コンピング。',
    },
    BASS: {
      you:     'G弦（Low-G）でルート音や経過音をゆったり弾く。',
      partner: '上の音域でメロディ+コードを担当する。',
      tip:     '1〜2小節に1〜2音で十分。多く弾くほど音が濁る。',
    },
    OBBLIGATO: {
      you:     'パートナーの合間を狙って短いフレーズを差し込む即興演奏。',
      partner: 'コードを厚めに弾き、隙間を作ってくれる。',
      tip:     '帯域マップの緑エリアが出たタイミングだけ弾く。',
    },

/**
 * ユーザーとパートナーの音域棲み分けを横長バーで可視化
 * @private
 */
function _ssRenderRangeDiagram(userRoleKey, partnerRoleKey) {
  const MIDI_MIN = 48, MIDI_MAX = 84, RANGE = MIDI_MAX - MIDI_MIN;
  const userRole    = SESSION_ROLES[userRoleKey];
  const partnerRole = SESSION_ROLES[partnerRoleKey];
  if (!userRole || !partnerRole) return '';

  const pct = (midi) => ((midi - MIDI_MIN) / RANGE * 100).toFixed(1);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const makeBar = (role, color, label) => {
    const lo = clamp(role.midiRange[0], MIDI_MIN, MIDI_MAX);
    const hi = clamp(role.midiRange[1], MIDI_MIN, MIDI_MAX);
    const left  = pct(lo);
    const width = pct(hi) - pct(lo);
    return `
      <div style="position:relative;height:18px;margin-bottom:4px">
        <div style="position:absolute;left:${left}%;width:${width}%;height:100%;
                    background:${color};opacity:0.5;border-radius:4px"></div>
        <div style="position:absolute;left:${left}%;font-size:9px;
                    color:${color};top:2px;padding-left:4px;font-weight:700">${label}</div>
      </div>`;
  };

  const labels = ['C3','','','','C4','','','','C5','','','','C6'].map((l, i) =>
    l ? `<span style="position:absolute;left:${(i/12*100).toFixed(1)}%;font-size:8px;
                color:var(--text3);transform:translateX(-50%)">${l}</span>` : ''
  ).join('');

  return `
    <div style="position:relative;background:var(--bg3);border-radius:6px;
                padding:6px 6px 14px;overflow:hidden">
      ${makeBar(userRole,    userRole.color,    `あなた: ${userRole.label}`)}
      ${makeBar(partnerRole, partnerRole.color, `パートナー: ${partnerRole.label}`)}
      <div style="position:relative;height:12px;border-top:1px solid var(--border);
                  margin-top:2px">${labels}</div>
    </div>`;
}

// ---------------------------------------------------------------
// 帯域ビジュアライザ（SVG描画）
// ---------------------------------------------------------------

/**
 * メイン描画関数
 * @param {Array|null} freqBands  buildFreqBands() の出力（nullなら空表示）
 * @param {number}     currentMi  現在の小節インデックス
 */
function _ssRenderFreqViz(freqBands, currentMi) {
  const svg = document.getElementById('ss-freq-viz');
  if (!svg) return;

  const W       = 680;
  const H       = 200;
  const MIDI_MIN= FREQ_VIZ.MIDI_MIN;  // 36
  const MIDI_MAX= FREQ_VIZ.MIDI_MAX;  // 96
  const RANGE   = MIDI_MAX - MIDI_MIN; // 60半音
  const GRID    = FREQ_VIZ.BEAT_GRID;
  const ML      = 32;   // 左マージン（音名ラベル）
  const MR      = 8;
  const MT      = 12;
  const MB      = 20;
  const innerW  = W - ML - MR;
  const innerH  = H - MT - MB;
  const beatW   = innerW / (freqBands?.[currentMi]?.length ?? GRID.length);

  const userProf = INSTRUMENT_PROFILES[ssUserInstrument];

  // MIDI → Y座標（高音が上）
  const midiToY = (midi) =>
    MT + innerH - ((midi - MIDI_MIN) / RANGE) * innerH;

  let h = '';

  // 背景
  h += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--bg2)" rx="6"/>`;

  // 音名ラベル（C2, C3, C4, C5, C6, C7）
  [36, 48, 60, 72, 84, 96].forEach(midi => {
    const y    = midiToY(midi);
    const name = ['C2','C3','C4','C5','C6','C7'][(midi - 36) / 12];
    h += `<line x1="${ML}" y1="${y}" x2="${W - MR}" y2="${y}"
                stroke="var(--border)" stroke-width="0.8" stroke-dasharray="3,3"/>`;
    h += `<text x="${ML - 4}" y="${y + 4}" text-anchor="end"
                font-size="9" fill="var(--text3)">${name}</text>`;
  });

  // ユーザー楽器の音域帯（薄い背景色）
  if (userProf) {
    const yTop = midiToY(userProf.range.max);
    const yBot = midiToY(userProf.range.min);
    h += `<rect x="${ML}" y="${yTop}" width="${innerW}" height="${yBot - yTop}"
                fill="var(--blue)" opacity="0.06" rx="2"/>`;
    h += `<text x="${ML + 4}" y="${yTop + 12}" font-size="9" fill="var(--blue)" opacity="0.6">
            ${userProf.label} 音域
          </text>`;
  }

  // U3: 引き算の見える化 — complexity に応じてパートナー占有帯域の濃さを変える
  const complexityVal = COMPLEXITY_PRESETS[ssComplexity]?.value ?? 0.5;
  const partnerOpacity = Math.max(0.2, 0.65 - complexityVal * 0.5).toFixed(2);

  // 現在小節の帯域データを描画
  const bands = freqBands?.[currentMi] ?? [];
  bands.forEach((band, bi) => {
    const x = ML + bi * beatW;

    if (band.occupiedRange) {
      // パートナー占有帯域（U3: complexity で透明度変化）
      const yTop = midiToY(band.occupiedRange.max);
      const yBot = midiToY(band.occupiedRange.min);
      h += `<rect x="${x + 1}" y="${yTop}" width="${beatW - 2}" height="${Math.max(yBot - yTop, 2)}"
                  fill="var(--orange)" opacity="${partnerOpacity}" rx="2"/>`;

      // 空き帯域（ユーザー音域内）を緑でハイライト
      if (userProf) {
        const freeRanges = _calcFreeRanges(band, userProf.range);
        freeRanges.forEach(fr => {
          const fyTop = midiToY(fr.max);
          const fyBot = midiToY(fr.min);
          const freeHeight = fyBot - fyTop;
          const freeOpacity = Math.min(0.15 + freeHeight / innerH * 0.5, 0.55).toFixed(2);
          h += `<rect x="${x + 1}" y="${fyTop}" width="${beatW - 2}" height="${Math.max(freeHeight, 2)}"
                      fill="var(--green)" opacity="${freeOpacity}" rx="1"/>`;
        });
      }
    }

    // beat ラベル
    if ([1, 2, 3, 4].includes(band.beat)) {
      h += `<text x="${x + beatW / 2}" y="${H - 4}" text-anchor="middle"
                  font-size="9" fill="var(--text3)">${band.beat}</text>`;
    }
  });

  // 再生位置カーソル
  if (bands.length > 0) {
    const ratio = (SessionPlayer.currentMeasure === currentMi)
      ? _ssCalcBeatProgress() : -1;
    if (ratio >= 0) {
      const cx = ML + ratio * innerW;
      h += `<line x1="${cx}" y1="${MT}" x2="${cx}" y2="${H - MB}"
                  stroke="var(--blue)" stroke-width="1.5" opacity="0.8"/>`;
    }
  }

  // 空の場合のプレースホルダ
  if (bands.length === 0) {
    h += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle"
                dominant-baseline="middle" font-size="12" fill="var(--text3)">
            「セッション開始」を押すと帯域が表示されます
          </text>`;
  }

  svg.innerHTML = h;
}

/**
 * ユーザー音域内の空き帯域リストを計算
 * @private
 */
function _calcFreeRanges(band, userRange) {
  const occupied = new Set(band.occupied ?? []);
  const free     = [];
  let   start    = null;

  for (let m = userRange.min; m <= userRange.max; m++) {
    if (!occupied.has(m)) {
      if (start === null) start = m;
    } else {
      if (start !== null) {
        free.push({ min: start, max: m - 1 });
        start = null;
      }
    }
  }
  if (start !== null) free.push({ min: start, max: userRange.max });
  return free;
}

/**
 * 現在の拍の進捗(0〜1)を返す（カーソル表示用）
 * @private
 */
function _ssCalcBeatProgress() {
  const ctx  = SessionPlayer.ctx;
  const mi   = SessionPlayer.currentMeasure ?? 0;
  const starts = SessionPlayer.measureStartTimes;

  if (!starts || starts.length === 0 || mi < 0) return -1;

  let elapsed;
  if (SessionPlayer.isPlaying && ctx) {
    elapsed = ctx.currentTime - SessionPlayer.startAudioTime + SessionPlayer.pauseAudioOffset;
  } else if (SessionPlayer.isPaused || SessionPlayer.pauseAudioOffset > 0) {
    elapsed = SessionPlayer.pauseAudioOffset;
  } else {
    return -1;
  }

  const miStart  = starts[mi] ?? 0;
  const miEnd    = starts[mi + 1] ?? SessionPlayer.totalDuration;
  const measureLen = miEnd - miStart;
  if (measureLen <= 0) return -1;

  return Math.min(Math.max((elapsed - miStart) / measureLen, 0), 1);
}

/**

function _ssRenderFretboardGuide(score, mi) {

  if (!_ssShouldShowFretboardGuide()) {

    return;

// ---------------------------------------------------------------

/**
 * 現在のモード・アシストレベルから、おすすめフレーズを表示すべきか判定する。
 * find_space モードは機能②と同じ理由で強制的に非表示にする。
 */
function _ssShouldShowPhrases() {
  if (ssMode === 'find_space') return false;
  return ASSIST_LEVELS[ssAssistLevel]?.showPhrases ?? false;
}

/**
 * 指定小節のコードから、おすすめフレーズカードを再描画する。
 * @param {object} score  SessionScore
 * @param {number} mi     小節インデックス
 */
function _ssRenderPhraseSuggestions(score, mi) {
  const section = document.getElementById('ss-phrase-section');
  const wrap    = document.getElementById('ss-phrase-cards');
  if (!section || !wrap) return;

  if (!_ssShouldShowPhrases()) {
    section.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  section.style.display = 'block';

  if (typeof suggestShortPhrases !== 'function') return;

  const chordName  = score?.measures?.[mi]?.chord ?? ssKey;
  const complexity = COMPLEXITY_PRESETS[ssComplexity]?.value ?? 0.5;

  // その小節でパートナーが占有しているMIDIを全拍分まとめて集計する
  const bands = score?.freqBands?.[mi] ?? [];
  const occupiedMidi = [...new Set(bands.flatMap(b => b.occupied ?? []))];

  const phrases = suggestShortPhrases(chordName, ssKey, {
    // [Bug-Fix] score.genre がnull（MIDIインポート由来）の場合にssGenreへ
    // フォールバックしない。ssGenreは「コード進行タブ」専用の状態のため、
    // MIDIタブのセッションにコード進行タブで過去に選んだジャンルが
    // 無関係に紛れ込んでしまう不具合があった。
    genre:          score?.genre ?? null,
    complexity,
    occupiedMidi,
    prevEndMidi:    _ssPrevPhraseEndMidi,
    userInstrument: ssUserInstrument,
    count:          3,
  });

  if (phrases.length === 0) {
    // [Bug-Fix] 生成に失敗した小節では脈絡をリセットする。
    // リセットしないと、次に成功した小節が数小節前の遠い音を
    // 開始点にしてしまい、不必要に大きな跳躍が起きうる。
    _ssPrevPhraseEndMidi = null;
    wrap.innerHTML = `<div style="font-size:11px;color:var(--text2);grid-column:1/-1">
      この小節は空きが少なく、お手本フレーズを提案できませんでした。
    </div>`;
    return;
  }

  // 次回呼び出し時の脈絡のため、先頭候補の終止音を記憶しておく
  _ssPrevPhraseEndMidi = phrases[0].endMidi ?? null;

  wrap.innerHTML = phrases.map((p, i) => `
    <div style="background:var(--bg2);border-radius:10px;padding:8px;text-align:center">
      <svg id="ss-phrase-svg-${i}" viewBox="0 0 160 64" style="width:100%;display:block"></svg>
      <div style="font-size:10px;color:var(--text2);margin-top:2px">${p.motifName ?? ''}</div>
    </div>`
  ).join('');

  phrases.forEach((p, i) => {
    if (typeof drawPhraseCard === 'function') drawPhraseCard(`ss-phrase-svg-${i}`, p);
  });
}

// ---------------------------------------------------------------

let _ssHintTimer      = null;
let _ssHintCache      = null;
let _ssHintCacheMi    = -1;
let _ssHintCacheBeat  = -1;

function _ssRenderHint(mi) {
  const wrap = document.getElementById('ss-hint');
  const activeScore = SessionPlayer.score ?? ssCurrentScore;
  if (!wrap || !activeScore?.freqBands) return;
  _ssHintCacheMi   = -1;
  _ssHintCacheBeat = -1;
  _ssHintCache     = null;

  if (_ssHintTimer) clearInterval(_ssHintTimer);
  _ssHintTimer = setInterval(() => _ssUpdateHintBeat(mi), 250);
  _ssUpdateHintBeat(mi);
}

function _ssUpdateHintBeat(mi) {
  const wrap = document.getElementById('ss-hint');
  if (!wrap) return;

  const activeScore = SessionPlayer.score ?? ssCurrentScore;
  if (!activeScore?.freqBands) return;

  const activeMi = SessionPlayer.currentMeasure >= 0
    ? SessionPlayer.currentMeasure : ssCurrentMeasure;

  const bands = activeScore.freqBands[activeMi] ?? [];
  if (bands.length === 0) return;

  const progress = _ssCalcBeatProgress();
  const beatIdx = progress >= 0
    ? Math.min(Math.floor(progress * bands.length), bands.length - 1)
    : 0;

  if (activeMi === _ssHintCacheMi && beatIdx === _ssHintCacheBeat && _ssHintCache) {
    return;
  }

  const band = bands[beatIdx] ?? bands[0];
  _ssHintCache     = generateSpaceHint(band, ssUserInstrument);
  _ssHintCacheMi   = activeMi;
  _ssHintCacheBeat = beatIdx;

  _ssDrawHint(_ssHintCache);
}

function _ssDrawHint(hintData) {
  const wrap = document.getElementById('ss-hint');
  if (!wrap || !hintData) return;

  const { role } = hintData;
  const roleInfo = role ? SESSION_ROLES[role] : null;
  const isRest   = (role === null);

  const shortHint = _ssMakeShortHint(hintData);

  const bg     = isRest ? 'var(--orange-light)' : 'var(--green-light)';
  const border = isRest ? 'var(--orange)'        : 'var(--green)';
  const color  = isRest ? 'var(--orange)'        : (roleInfo?.color ?? 'var(--green)');

  if (wrap._fadePending) {
    clearTimeout(wrap._fadeTimer);
    wrap._fadePending = false;
    wrap.innerHTML = _ssHintHTML(shortHint, bg, border, color);
    requestAnimationFrame(() => {
      const inner = wrap.querySelector('.ss-hint-inner');
      if (inner) inner.style.opacity = '1';
    });
    return;
  }

  const inner = wrap.querySelector('.ss-hint-inner');
  if (inner) {
    inner.style.opacity = '0';
    wrap._fadePending = true;
    wrap._fadeTimer = setTimeout(() => {
      wrap._fadePending = false;
      wrap.innerHTML = _ssHintHTML(shortHint, bg, border, color);
      requestAnimationFrame(() => {
        const newInner = wrap.querySelector('.ss-hint-inner');
        if (newInner) newInner.style.opacity = '1';
      });
    }, 150);
  } else {
    wrap.innerHTML = _ssHintHTML(shortHint, bg, border, color);
    requestAnimationFrame(() => {
      const newInner = wrap.querySelector('.ss-hint-inner');
      if (newInner) newInner.style.opacity = '1';
    });
  }
}

function _ssHintHTML(shortHint, bg, border, color) {
  return `<div class="ss-hint-inner"
    style="border-radius:10px;border:1px solid ${border};
           padding:8px 14px;background:${bg};
           opacity:0;transition:opacity 0.3s ease;
           display:flex;align-items:center;gap:10px">
    <div style="font-size:15px;font-weight:700;color:${color};
                letter-spacing:0.02em;line-height:1.4">
      ${shortHint}
    </div>
  </div>`;
}

function _ssMakeShortHint(hintData) {
  const { hint, role } = hintData;
  if (role === null) {
    if (hint.includes('引く番') || hint.includes('待') || hint.includes('引き'))
      return '🤫 待て';
    if (hint.includes('聴き'))
      return '👂 聴こう';
    if (hint.includes('隙間'))
      return '⏳ 隙間を待つ';
    return '🤫 今は休む';
  }
  if (role === 'MELODY_HIGH') {
    if (hint.includes('高音') || hint.includes('A弦'))
      return '🎵 高音域へ';
    if (hint.includes('フレーズ') || hint.includes('旋律'))
      return '🎵 メロディ！';
    return '🎵 高音空き';
  }
  if (role === 'MELODY_MID') {
    if (hint.includes('中') || hint.includes('E') || hint.includes('C弦'))
      return '🎶 中音域へ';
    return '🎶 対旋律';
  }
  if (role === 'OBBLIGATO') {
    if (hint.includes('高音') || hint.includes('A弦') || hint.includes('上'))
      return '✨ 高音空き！';
    if (hint.includes('フレーズ'))
      return '✨ 短いフレーズ！';
    return '✨ 狭い隙間';
  }
  if (role === 'CHORD_COMP') {
    if (hint.includes('中') || hint.includes('E/C'))
      return '🎸 中域コンプ';
    return '🎸 コードトーン';
  }
  if (role === 'BASS') {
    return '🔉 ルート音へ';
  }
  if (role === 'RHYTHM') {
    return '🥁 リズムを刻む';
  }
  return '💭 スペースあり';
}

function _ssRenderBatonBanner(currentRole, nextRole) {
  const wrap = document.getElementById('ss-baton-banner');

  const curr = SESSION_ROLES[currentRole];
  if (!curr) { wrap.innerHTML = ''; return; }

  const isSameRole = (currentRole === nextRole);
  const next = isSameRole ? null : SESSION_ROLES[nextRole];

  wrap.innerHTML = `
    <div style="text-align:center;padding:10px;border-radius:10px;
                background:var(--amber-light);border:2px solid var(--amber);
                animation:ss-blink 0.8s ease-in-out 3">
      <div style="font-size:12px;color:var(--amber);font-weight:700">
        ${isSameRole ? 'バトンタッチ！ あなたの担当が変わりました' : '次の小節から役割が変わります'}
      </div>
      <div style="font-size:15px;margin-top:4px">
        ${isSameRole
          ? `${curr.emoji} ${curr.label} を担当してください`
          : `${curr.emoji} ${curr.label} → ${next?.emoji ?? ''} ${next?.label ?? ''}`}
      </div>
    </div>`;

  setTimeout(() => { if (wrap) wrap.innerHTML = ''; }, 3000);
}

// ---------------------------------------------------------------
// 再生コントロールUI
// ---------------------------------------------------------------

function _ssRenderPlayerBar() {
  const wrap = document.getElementById('ss-player-bar');
  if (!wrap) return;

  const isPlaying = SessionPlayer.isPlaying;
  const curMi     = (SessionPlayer.currentMeasure ?? -1) + 1;
  const totalMi   = ssCurrentScore?.measures?.length ?? 0;
  const tempo     = SessionPlayer.tempo ?? ssTempo;
  const hasScore  = !!ssCurrentScore;

  wrap.innerHTML = `
    <div id="ss-player-inner"
         style="background:var(--surface);border-radius:12px;
                border:1px solid var(--border);padding:10px 14px">

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

        <button class="ss-ctrl-btn" title="先頭へ"
                onclick="sessionPlayerSeek(0);_ssRenderPlayerBar()"
                ${!hasScore ? 'disabled style="opacity:0.4"' : ''}>⏮</button>

        <button class="ss-ctrl-btn" title="前の小節"
                onclick="sessionPlayerSeekToMeasure(-1);_ssSoftUpdatePlayerBar()"
                ${!hasScore ? 'disabled style="opacity:0.4"' : ''}>◀</button>

        <button id="ss-play-btn" class="ss-ctrl-btn"
                title="${isPlaying ? '一時停止' : '再生'}"
                onclick="ssTogglePlay()"
                style="background:var(--green);color:#fff;border-color:var(--green)">
          ${isPlaying ? '⏸' : '▶'}
        </button>

        <button class="ss-ctrl-btn" title="停止"
                onclick="sessionPlayerStop();_ssRenderPlayerBar()">⏹</button>

        <button class="ss-ctrl-btn" title="次の小節"
                onclick="sessionPlayerSeekToMeasure(1);_ssSoftUpdatePlayerBar()"
                ${!hasScore ? 'disabled style="opacity:0.4"' : ''}>▶▶</button>

        <div id="ss-measure-label"
             style="font-size:12px;color:var(--text2);min-width:60px">
          小節 ${hasScore ? `${curMi} / ${totalMi}` : '- / -'}
        </div>

        <div style="flex:1"></div>

        <div style="display:flex;gap:6px">
          ${[
            { v:'melody', label:'メロディ',   icon:'🎵' },
            { v:'bass',   label:'ベース',     icon:'🔉' },
            { v:'inner',  label:'コンピング', icon:'🎸' },
          ].map(({ v, label, icon }) =>
            `<button class="ss-mute-btn ${SessionPlayer.mute[v] ? 'muted' : ''}"
                     onclick="ssToggleMute('${v}')"
                     title="${label}ミュート">${icon}</button>`
          ).join('')}
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--text2);white-space:nowrap">🎚 テンポ</span>
        <input type="range" id="ss-tempo-slider"
               min="40" max="240" step="1" value="${tempo}"
               style="flex:1;accent-color:var(--green)"
               oninput="ssOnTempoInput(this.value)"
               onchange="ssOnTempoCommit(this.value)">
        <span id="ss-tempo-label"
              style="font-size:12px;font-weight:700;min-width:44px;
                     text-align:right;color:var(--text)">
          ${tempo} <span style="font-size:10px;color:var(--text2)">BPM</span>
        </span>
      </div>
    </div>`;
}

function _ssSoftUpdatePlayerBar() {
  const playBtn = document.getElementById('ss-play-btn');
  const label   = document.getElementById('ss-measure-label');
  const isPlaying = SessionPlayer.isPlaying;
  const curMi     = (SessionPlayer.currentMeasure ?? -1) + 1;
  const totalMi   = ssCurrentScore?.measures?.length ?? 0;

  if (playBtn) {
    playBtn.textContent = isPlaying ? '⏸' : '▶';
    playBtn.title       = isPlaying ? '一時停止' : '再生';
  }
  if (label) {
    label.textContent = `小節 ${curMi > 0 ? `${curMi} / ${totalMi}` : '- / -'}`;
  }
}

// ---------------------------------------------------------------
// セッション開始
// ---------------------------------------------------------------

function ssStart() {
  const usingMidi = ssActiveTab === 'midi';

  // [Fix-ActivePath] どちらの生成パイプラインを使うかは常にタブで決まる。
  if (usingMidi && !ssMidiPreview) {
    alert('MIDIファイルを読み込んでください');
    return;
  }
  if (!usingMidi && (!ssChords || ssChords.length === 0)) {
    alert('コード進行を入力してください');
    return;
  }

  // ヒントキャッシュをリセット
  _ssHintCache     = null;
  _ssHintCacheMi   = -1;
  _ssHintCacheBeat = -1;
  if (_ssHintTimer) { clearInterval(_ssHintTimer); _ssHintTimer = null; }

  // [Feature-3] 新しいセッションの開始なので、フレーズの脈絡もリセットする
  _ssPrevPhraseEndMidi = null;

  // モード別のデフォルト役割を適用してから役割パネルを確定させる
  const modeConf = SESSION_MODES[ssMode];
  if (modeConf?.defaultUserRole) {
    ssUserRole = modeConf.defaultUserRole;
  }
  _ssUpdateRolePanel();
  if (modeConf?.defaultPartnerRole) {
    ssPartnerRole = modeConf.defaultPartnerRole;
  }

  const complexity = COMPLEXITY_PRESETS[ssComplexity]?.value ?? 0.5;

  let score;

  if (usingMidi) {
    // [Fix-MidiPreview] ファイル選択時に解析済みの ImportResult をそのまま使う（二重パース回避）。
    let importedScore;
    try {
      const importResult = ssMidiPreview;

      if (importResult.key && importResult.key !== ssKey) {
        ssKey = importResult.key; // 内部キーを同期（表示は既にプレビューで見せている）
      }

      // [固定] MIDIインポートは常にウクレレ最適化モードで変換する。
      const playMode = 'ukulele';
      importedScore = buildSoloScoreFromImport(importResult, {
        key:          importResult.key ?? ssKey,
        playMode,
        complexity,
        arrangeStyle: 'standard',
      });
    } catch (err) {
      console.error('MIDIスコア変換エラー:', err);
      alert(`MIDIの変換に失敗しました: ${err.message ?? err}`);
      return;
    }
    score = importedScore;

    if (score.tempo && score.tempo !== ssTempo) {
      ssTempo = score.tempo;
    }

    // セッション用の声部フィルタ・楽器制約を適用する
    const partnerProf   = INSTRUMENT_PROFILES[ssPartnerInstrument];
    const voiceToRemove = SESSION_ROLES[ssUserRole]?.voice ?? null;

    score.measures = score.measures.map(m => {
      let events = m.events ?? [];
      if (voiceToRemove) {
        events = events.filter(ev => ev.voice !== voiceToRemove);
      }
      if (partnerProf && !partnerProf.roleCapable.BASS) {
        events = events.filter(ev => ev.voice !== 'bass');
      }
      return { ...m, events };
    });

    // [Fix-Complexity] 演奏スタイル（複雑度）を初回生成時にも適用する。
    // 旧実装はバトンタッチで役割が切り替わった瞬間にしか反映されなかった。
    score.measures = score.measures.map(m => {
      const events = (m.events ?? []).map(ev => {
        const result = applySubtractionVoicing([ev], complexity, m.chord ?? ssKey, ssKey);
        return result[0] ?? null;
      }).filter(Boolean);
      return { ...m, events };
    });

    // chord が null のままの小節を補完
    score.measures = score.measures.map(m => ({
      ...m,
      chord: m.chord ?? ssKey,
    }));

    score.freqBands         = buildFreqBands(score.measures);
    score.partnerRole       = ssPartnerRole;
    score.userRole          = ssUserRole;
    score.partnerInstrument = ssPartnerInstrument;
    score._isSessionScore   = true;
    score._complexity       = complexity;

  } else {
    score = buildPartnerScore({
      chords:            ssChords,
      key:               ssKey,
      genre:             ssGenre,
      partnerInstrument: ssPartnerInstrument,
      partnerRole:       ssPartnerRole,
      userRole:          ssUserRole,
      complexity,
      arrangeStyle:      'standard',
    });
  }

  ssCurrentScore = score;
  ssCurrentScore._complexity = complexity;
  ssTempo = score.tempo ?? ssTempo;

  // ── タブ譜を初期描画（パートナースコア） ──
  _ssDrawPartnerTab(score, 0);
  _ssRenderFretboardGuide(score, 0);
  _ssRenderPhraseSuggestions(score, 0);

  // バトンタッチモードのスケジュール生成
  const batonSchedule = (ssMode === 'baton_touch')
    ? buildBatonSchedule(
        score.measures.length,
        ssBatonEvery,
        ssUserRole,
        ssPartnerRole,
        ssUserInstrument,
        ssPartnerInstrument
      )
    : null;

  // 帯域ビジュアライザを初期描画
  _ssRenderFreqViz(score.freqBands, 0);

  // 再生開始
  sessionPlayerPlay(score, {
    tempo:         ssTempo,
    loop:          true,
    batonSchedule,
    userRole:      ssUserRole,

    onMeasureChange: (mi, role) => {
      ssCurrentMeasure = mi;
      const latestScore = SessionPlayer.score ?? ssCurrentScore;
      _ssRenderFreqViz(latestScore.freqBands, mi);
      _ssRenderHint(mi);
      _ssDrawPartnerTab(latestScore, mi);
      _ssRenderFretboardGuide(latestScore, mi);
      _ssRenderPhraseSuggestions(latestScore, mi);
      _ssSoftUpdatePlayerBar();
    },

    onBatonSwitch: (current, next) => {
      _ssRenderBatonBanner(current, next);
      ssUpdateStatusBar(true);
    },

    onComplete: () => {
      if (_ssHintTimer) { clearInterval(_ssHintTimer); _ssHintTimer = null; }
      ssUpdateStatusBar(false);
      _ssRenderPlayerBar();
    },
  });

  ssUpdateStatusBar(true);
  _ssRenderPlayerBar();
}

// ---------------------------------------------------------------
// テンポ操作
// ---------------------------------------------------------------

function ssOnTempoInput(val) {
  const bpm = parseInt(val, 10);
  ssTempo   = bpm;
  const label = document.getElementById('ss-tempo-label');
  if (label) label.innerHTML = `${bpm} <span style="font-size:10px;color:var(--text2)">BPM</span>`;
}

function ssOnTempoCommit(val) {
  const bpm = parseInt(val, 10);
  ssTempo   = bpm;
  sessionPlayerSetTempo(bpm);
}

function sessionUIUpdateTempo(bpm) {
  ssTempo = bpm;
  const slider = document.getElementById('ss-tempo-slider');
  const label  = document.getElementById('ss-tempo-label');
  if (slider) slider.value = bpm;
  if (label)  label.innerHTML = `${bpm} <span style="font-size:10px;color:var(--text2)">BPM</span>`;
}

// ---------------------------------------------------------------
// イベントハンドラ群（コード進行タブ）
// ---------------------------------------------------------------

/**
 * かんたんスタート: ジャンル選択のみで推奨値を自動セット
 * キー・コード・複雑度・役割をジャンルの推奨値で上書きする。
 *
 * [Fix-GenreChords] ジャンルに応じてコード進行自体も変化させる。
 * 王道進行を土台に、ジャンルごとの展開戦略（expandProgressionForGenre）を適用する。
 */
function ssSetGenreQuick(genre) {
  ssGenre = genre;
  const preset = GENRE_PRESETS[genre];

  if (preset?.tempo) {
    ssTempo = preset.tempo;
    if (typeof sessionUIUpdateTempo === 'function') sessionUIUpdateTempo(ssTempo);
  }

  ssKey = 'C';

  const baseProg = (typeof PROGRESSIONS !== 'undefined' && PROGRESSIONS['C']?.length > 0)
    ? PROGRESSIONS['C'][0].chords
    : ['C', 'G', 'Am', 'F'];

  if (typeof expandProgressionForGenre === 'function' && preset?.recommendedChords) {
    ssChords = expandProgressionForGenre(baseProg, ssKey, genre, preset.recommendedChords);
  } else {
    ssChords = baseProg;
  }

  ssComplexity = 'standard';
  ssUserRole = 'MELODY_HIGH';

  _ssRenderSetupPanel();
}

function ssSetUserInstrument(v) {
  ssUserInstrument = v;
  const prof = INSTRUMENT_PROFILES[v];
  if (prof && prof.roleCapable[ssUserRole] === false) {
    ssUserRole = 'MELODY_HIGH';
  }
  _ssRefreshCommonControls();
}

function ssSetPartnerInstrument(v) {
  ssPartnerInstrument = v;
  _ssRefreshCommonControls();
}

function ssSetUserRole(v) {
  ssUserRole = v;
  _ssUpdateRolePanel();
}

function ssResetScore() {
  // 引き算率は廃止のため何もしない（後方互換のため関数は残す）
}

function ssUpdateStatusBar(show) {
  const bar = document.getElementById('ss-status-bar');
  if (!bar) return;
  if (!show) { bar.style.display = 'none'; return; }

  bar.style.display = 'block';
  const roleInfo    = SESSION_ROLES[SessionPlayer.batonUserRole ?? ssUserRole];
  const modeInfo    = SESSION_MODES[ssMode];
  const roleEl      = document.getElementById('ss-status-role');
  const modeEl      = document.getElementById('ss-status-mode');
  if (roleEl && roleInfo) {
    roleEl.innerHTML =
      `<span style="font-weight:700;color:${roleInfo.color}">
         ${roleInfo.emoji} ${roleInfo.label}
       </span>
       <span style="font-size:10px;color:var(--text2);margin-left:4px">を担当中</span>`;
  }
  if (modeEl && modeInfo) {
    modeEl.textContent = `${modeInfo.emoji} ${modeInfo.label}`;
  }
}

function ssApplyProgression(chordsStr) {
  ssChords = chordsStr.split(',').filter(Boolean);
  _ssRefreshTabContent();
}

function ssExpandChords() {
  if (typeof expandProgressionForGenre === 'function') {
    ssChords = expandProgressionForGenre(ssChords, ssKey, ssGenre);
    _ssRefreshTabContent();
    return;
  }
  const guide  = GENRE_PRESETS[ssGenre];
  const target = guide?.recommendedChords ?? Math.max(ssChords.length * 2, 8);
  if (ssChords.length === 0) return;
  const result = [];
  while (result.length < target) result.push(...ssChords);
  ssChords = result.slice(0, target);
  _ssRefreshTabContent();
}

function ssSetKey(v) {
  const prevKey = ssKey;
  ssKey = v;
  if (typeof PROGRESSIONS !== 'undefined') {
    const prevProgs = PROGRESSIONS[prevKey] ?? [];
    const newProgs  = PROGRESSIONS[v]       ?? [];
    const matched   = prevProgs.find(p => p.chords.join(' ') === ssChords.join(' '));
    if (matched) {
      const newProg = newProgs.find(p => p.name === matched.name);
      if (newProg) ssChords = newProg.chords;
    }
  }
  _ssRefreshTabContent();
}

function ssSetComplexity(v) {
  ssComplexity = v;
  _ssRefreshTabContent();
}

function ssSetMode(v) {
  ssMode = v;
  _ssRefreshCommonControls();
  // find_space切り替え時にガイド/フレーズ提案の表示可否を即時反映する
  if (ssCurrentScore) {
    const latestScore = SessionPlayer.score ?? ssCurrentScore;
    const mi = SessionPlayer.currentMeasure >= 0 ? SessionPlayer.currentMeasure : 0;
    _ssRenderFretboardGuide(latestScore, mi);
    _ssRenderPhraseSuggestions(latestScore, mi);
  }
}

/**
 * アシストレベル変更ハンドラ。
 */
function ssSetAssistLevel(v) {
  ssAssistLevel = v;
  _ssRefreshCommonControls();
  if (ssCurrentScore) {
    const latestScore = SessionPlayer.score ?? ssCurrentScore;
    const mi = SessionPlayer.currentMeasure >= 0 ? SessionPlayer.currentMeasure : 0;
    _ssRenderFretboardGuide(latestScore, mi);
    _ssRenderPhraseSuggestions(latestScore, mi);
  }
}

let _ssSetChordsTimer = null;
function ssSetChords(str) {
  ssChords = str.trim().split(/\s+/).filter(Boolean);
  clearTimeout(_ssSetChordsTimer);
  _ssSetChordsTimer = setTimeout(() => _ssRefreshTabContent(), 500);
}

function ssTogglePlay() {
  if (SessionPlayer.isPlaying) {
    sessionPlayerPause();
  } else if (SessionPlayer.isPaused) {
    sessionPlayerPlay(ssCurrentScore, {
      tempo:         SessionPlayer.tempo ?? ssTempo,
      loop:          true,
      batonSchedule: SessionPlayer.batonSchedule,
      userRole:      SessionPlayer.batonUserRole ?? ssUserRole,
      onMeasureChange: (mi) => {
        ssCurrentMeasure = mi;
        const latestScore = SessionPlayer.score ?? ssCurrentScore;
        _ssRenderFreqViz(latestScore.freqBands, mi);
        _ssRenderHint(mi);
        _ssDrawPartnerTab(latestScore, mi);
        _ssRenderFretboardGuide(latestScore, mi);
        _ssRenderPhraseSuggestions(latestScore, mi);
        _ssSoftUpdatePlayerBar();
      },
      onBatonSwitch: (curr, next) => _ssRenderBatonBanner(curr, next),
      onComplete:    ()           => _ssRenderPlayerBar(),
    });
  } else {
    ssStart();
  }
  _ssRenderPlayerBar();
}

function ssToggleMute(voice) {
  SessionPlayer.mute[voice] = !SessionPlayer.mute[voice];
  _ssRenderPlayerBar();
}

// ---------------------------------------------------------------
// イベントハンドラ群（MIDIタブ）
// ---------------------------------------------------------------

/**
 * MIDIファイル選択時のハンドラ。
 * [Fix-MidiPreview] この時点で importFromMidi() まで実行し、
 * 検出されたキー・コード進行・テンポをその場でプレビュー表示する。
 * 「セッション開始」時は、ここでキャッシュした ImportResult をそのまま再利用する
 * （二重パースを避け、表示と実際の生成内容のズレも防ぐ）。
 */
function ssHandleMidiFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById('ss-midi-status');
  if (status) { status.textContent = '読み込み中…'; status.style.color = 'var(--text2)'; }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const result = importFromMidi(e.target.result);
      if (!result.measures || result.measures.length === 0) {
        throw new Error(result.warnings?.[0] ?? 'MIDIから演奏データを読み取れませんでした');
      }
      ssMidiPreview  = result;
      ssMidiFileName = file.name;
      _ssRefreshTabContent();
    } catch (err) {
      ssMidiPreview  = null;
      ssMidiFileName = null;
      _ssRefreshTabContent();
      const st = document.getElementById('ss-midi-status');
      if (st) {
        st.innerHTML = `⚠️ ${_escHtml(err.message ?? 'MIDIファイルを読み込めませんでした')}`;
        st.style.color = 'var(--orange)';
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

/**
 * 読み込んだMIDIを取り消し、ファイル未選択の状態に戻す。
 */
function ssClearMidi() {
  ssMidiPreview  = null;
  ssMidiFileName = null;
  _ssRefreshTabContent();
}

// ---------------------------------------------------------------
// パートナータブ譜描画
// ---------------------------------------------------------------

/**
 * パートナーのスコアを drawSoloTab で描画する
 *
 * @param {object} score     SessionScore
 * @param {number} focusMi   ハイライトする小節インデックス（-1で無効）
 */
function _ssDrawPartnerTab(score, focusMi = -1) {
  if (!score || !score.measures) return;
  if (typeof drawSoloTab !== 'function') {
    console.warn('drawSoloTab が未定義です。solo_js_drawing.txt を include してください。');
    return;
  }

  const drawScore = {
    key:          score.key          ?? ssKey,
    tempo:        score.tempo        ?? 100,
    // [Bug-Fix] score.genre がnull（MIDIインポート由来）の場合にssGenreへ
    // フォールバックしない。フレーズ提案と同じ理由で、MIDIセッション中に
    // 無関係なジャンル名（コード進行タブで過去に選んだもの）がTAB譜上部に
    // 表示されてしまう不具合があった。genreがnullならラベルは空表示になる
    // （drawSoloTab側で `score.genre ? ... : ''` として既にハンドリング済み）。
    genre:        score.genre        ?? null,
    difficulty:   score.difficulty   ?? 'mid',
    arrangeStyle: score.arrangeStyle ?? 'standard',
    measures:     score.measures,
  };

  drawSoloTab('ss-tab-svg', drawScore, focusMi);
}

// ---------------------------------------------------------------
// UIコールバック（session_player.txtから呼ばれる）
// ---------------------------------------------------------------

function sessionUIUpdatePlayerState(state) {
  _ssRenderPlayerBar();
}
</script>
