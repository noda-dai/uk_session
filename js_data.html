<script>
// ===================================================================
// js_data.txt  ― 全12キー対応 + MIDIノート変換ユーティリティ
// ===================================================================

// ---------------------------------------------------------------
// 音名ユーティリティ（既存）
// ---------------------------------------------------------------
const CHROMATIC = ['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];

const NOTE_EN = {
  'ド':'C', 'ド#':'C#', 'レ':'D', 'レ#':'D#',
  'ミ':'E', 'ファ':'F', 'ファ#':'F#', 'ソ':'G',
  'ソ#':'G#', 'ラ':'A', 'ラ#':'A#', 'シ':'B',
};
const NOTE_EN_FLAT = {
  'ド':'C', 'ド#':'Db', 'レ':'D', 'レ#':'Eb',
  'ミ':'E', 'ファ':'F', 'ファ#':'Gb', 'ソ':'G',
  'ソ#':'Ab', 'ラ':'A', 'ラ#':'Bb', 'シ':'B',
};
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb']);

function toEnChordName(noteJa, suffix, keyName) {
  const useFlat = FLAT_KEYS.has(keyName);
  const base = (useFlat ? NOTE_EN_FLAT : NOTE_EN)[noteJa] || noteJa;
  return base + (suffix || '');
}

function displayNote(noteJa, key) {
  const k = key || currentKey;
  const useFlat = FLAT_KEYS.has(k);
  return (useFlat ? NOTE_EN_FLAT : NOTE_EN)[noteJa] || noteJa;
}

// ---------------------------------------------------------------
// MIDIノート変換ユーティリティ（新規追加）
// ---------------------------------------------------------------
// MIDIノート番号 ↔ {note(日本語内部表記), octave} の相互変換
// C4 = MiddleC = MIDI 60

/**
 * MIDIノート番号 → {note: '日本語音名', octave: number}
 * @param {number} midi  0-127
 * @returns {{note: string, octave: number}}
 */
function midiToNoteObj(midi) {
  const octave = Math.floor(midi / 12) - 1;
  const note   = CHROMATIC[midi % 12];
  return { note, octave };
}

/**
 * {note, octave} → MIDIノート番号
 * @param {string} noteJa  例: 'ド', 'ラ#'
 * @param {number} octave  例: 4
 * @returns {number} MIDIノート番号
 */
function noteObjToMidi(noteJa, octave) {
  const pc = CHROMATIC.indexOf(noteJa);
  if (pc < 0) return -1;
  return (octave + 1) * 12 + pc;
}

/**
 * 弦インデックス＋フレット → MIDIノート番号
 * ウクレレHighGチューニング: 4弦G4=67, 3弦C4=60, 2弦E4=64, 1弦A4=69
 * @param {number} stringIdx  0=G弦,1=C弦,2=E弦,3=A弦
 * @param {number} fret       0-12
 * @returns {number} MIDIノート番号
 */
function fretToMidi(stringIdx, fret) {
  // 各弦の開放音MIDIノート番号 (HighG チューニング)
  const OPEN_MIDI = [67, 60, 64, 69]; // G4, C4, E4, A4
  return OPEN_MIDI[stringIdx] + fret;
}

/**
 * MIDIノート番号 → 各弦での最も弾きやすいフレット位置を探す
 * @param {number} midi
 * @returns {Array<{stringIdx, fret}>} 候補リスト（押弦しやすい順）
 */
function midiToFretOptions(midi) {
  const OPEN_MIDI = [67, 60, 64, 69];
  const results = [];
  OPEN_MIDI.forEach((open, si) => {
    const fret = midi - open;
    if (fret >= 0 && fret <= 12) {
      results.push({ stringIdx: si, fret });
    }
  });
  // フレット番号が低い順（開放弦優先）
  results.sort((a, b) => a.fret - b.fret);
  return results;
}

// ウクレレの音域定数（HighGチューニング）
const UKULELE_MIDI_RANGE = {
  lowest:  60,  // C4  (3弦開放)
  highest: 81,  // A5  (1弦12F)
  melodyLow:  60, // メロディ推奨下限
  melodyHigh: 76, // メロディ推奨上限 (E5, 1弦7F付近)
};

// ---------------------------------------------------------------
// 弦データ（既存：drawHighPos等で使用）
// ---------------------------------------------------------------
const OPEN_IDX = [7, 0, 4, 9]; // [G弦, C弦, E弦, A弦] クロマチック上のインデックス

function noteAt(stringIdx, fret) {
  return CHROMATIC[(OPEN_IDX[stringIdx] + fret) % 12];
}

const STRINGS = [
  { num:4, notes: Array.from({length:13}, (_,i) => CHROMATIC[(7+i)%12]) },
  { num:3, notes: Array.from({length:13}, (_,i) => CHROMATIC[(0+i)%12]) },
  { num:2, notes: Array.from({length:13}, (_,i) => CHROMATIC[(4+i)%12]) },
  { num:1, notes: Array.from({length:13}, (_,i) => CHROMATIC[(9+i)%12]) },
];
const DISPLAY = [...STRINGS].reverse();

// ---------------------------------------------------------------
// スケール・コード構成音生成（既存）
// ---------------------------------------------------------------
function buildMajorScale(rootIdx) {
  const steps = [0,2,4,5,7,9,11];
  return steps.map(s => CHROMATIC[(rootIdx + s) % 12]);
}
function buildHalfTones(scale) {
  return CHROMATIC.filter(n => !scale.includes(n));
}
function buildPenta(rootIdx) {
  const steps = [0,2,4,7,9];
  return steps.map(s => CHROMATIC[(rootIdx + s) % 12]);
}

function triad(rootIdx, type) {
  if (type === 'maj')  return [0,4,7].map(s => CHROMATIC[(rootIdx+s)%12]);
  if (type === 'min')  return [0,3,7].map(s => CHROMATIC[(rootIdx+s)%12]);
  if (type === 'dom7') return [0,4,7,10].map(s => CHROMATIC[(rootIdx+s)%12]);
  if (type === 'min7') return [0,3,7,10].map(s => CHROMATIC[(rootIdx+s)%12]);
  return [];
}

// ---------------------------------------------------------------
// KEY_DEFS（既存）
// ---------------------------------------------------------------
// [C-2] よく使うキーを先頭に並べ替え（C/G/F/D/A/Bb が上位に来るよう）
const KEY_DEFS = [
  { key:'C',  label:'Cメジャー',  root:'ド',    idx:0  },
  { key:'G',  label:'Gメジャー',  root:'ソ',    idx:7  },
  { key:'F',  label:'Fメジャー',  root:'ファ',  idx:5  },
  { key:'D',  label:'Dメジャー',  root:'レ',    idx:2  },
  { key:'A',  label:'Aメジャー',  root:'ラ',    idx:9  },
  { key:'Bb', label:'B♭メジャー', root:'ラ#',   idx:10 },
  { key:'E',  label:'Eメジャー',  root:'ミ',    idx:4  },
  { key:'Eb', label:'E♭メジャー', root:'レ#',   idx:3  },
  { key:'B',  label:'Bメジャー',  root:'シ',    idx:11 },
  { key:'Ab', label:'A♭メジャー', root:'ソ#',   idx:8  },
  { key:'Db', label:'D♭メジャー', root:'ド#',   idx:1  },
  { key:'Gb', label:'G♭メジャー', root:'ファ#', idx:6  },
];

function buildChords(rootIdx, keyName) {
  const I   = rootIdx;
  const II  = (rootIdx+2)%12;
  const III = (rootIdx+4)%12;
  const IV  = (rootIdx+5)%12;
  const V   = (rootIdx+7)%12;
  const VI  = (rootIdx+9)%12;

  const n  = (idx) => CHROMATIC[idx % 12];
  const en = (noteJa, suffix='') => toEnChordName(noteJa, suffix, keyName);
  const dispNotes = (arr) => arr.map(n => displayNote(n, keyName)).join('・');

  const cI    = { name: en(n(I)),       notes: triad(I,  'maj'),  desc: `${dispNotes(triad(I,'maj'))} ― ${KEY_DEFS.find(d=>d.idx===rootIdx)?.label || ''}の主和音。` };
  const cIIm  = { name: en(n(II),'m'),  notes: triad(II, 'min'),  desc: `${dispNotes(triad(II,'min'))} ― IIm和音。` };
  const cIIIm = { name: en(n(III),'m'), notes: triad(III,'min'),  desc: `${dispNotes(triad(III,'min'))} ― IIIm和音。` };
  const cIV   = { name: en(n(IV)),      notes: triad(IV, 'maj'),  desc: `${dispNotes(triad(IV,'maj'))} ― IV和音。温かく安定。` };
  const cV    = { name: en(n(V)),       notes: triad(V,  'maj'),  desc: `${dispNotes(triad(V,'maj'))} ― V和音。解決感。` };
  const cV7   = { name: en(n(V),'7'),   notes: triad(V,  'dom7'), desc: `${dispNotes(triad(V,'dom7'))} ― 属七。強い解決感。` };
  const cVIm  = { name: en(n(VI),'m'),  notes: triad(VI, 'min'),  desc: `${dispNotes(triad(VI,'min'))} ― VIm。平行短調。` };

  const obj = {};
  [cI, cIIm, cIIIm, cIV, cV, cV7, cVIm].forEach(c => { obj[c.name] = { notes: c.notes, desc: c.desc }; });
  return obj;
}

const KEY_DATA = {};
KEY_DEFS.forEach(kd => {
  const scale = buildMajorScale(kd.idx);
  KEY_DATA[kd.key] = {
    label:  kd.label,
    root:   kd.root,
    scale,
    half:   buildHalfTones(scale),
    penta:  buildPenta(kd.idx),
    chords: buildChords(kd.idx, kd.key),
  };
});

// ---------------------------------------------------------------
// MOVABLE_CHORDS（既存：drawHighPos・タブエンジンで使用）
// ---------------------------------------------------------------
function buildHpChordsForKey(keyIdx) {
  return {
    I:  CHROMATIC[(keyIdx)     % 12],
    IV: CHROMATIC[(keyIdx + 5) % 12],
    V:  CHROMATIC[(keyIdx + 7) % 12],
  };
}

function fShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const eIdx    = (rootIdx - 4 + 12) % 12;
  const eFret   = eIdx <= 6 ? eIdx : eIdx - 12 + 12;
  const offset  = eIdx;
  return {
    frets: [offset+2, offset, offset+1, offset],
    notes: [
      CHROMATIC[(7  + offset+2) % 12],
      CHROMATIC[(0  + offset)   % 12],
      CHROMATIC[(4  + offset+1) % 12],
      CHROMATIC[(9  + offset)   % 12],
    ],
  };
}
function aShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const gFret   = (rootIdx - 7 + 24) % 12;
  const offset  = gFret;
  return {
    frets: [offset, offset+3, offset+3, offset+3],
    notes: [
      CHROMATIC[(7  + offset)   % 12],
      CHROMATIC[(0  + offset+3) % 12],
      CHROMATIC[(4  + offset+3) % 12],
      CHROMATIC[(9  + offset+3) % 12],
    ],
  };
}
function bbShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const aFret   = (rootIdx - 9 + 24) % 12;
  const offset  = aFret;
  return {
    frets: [offset+2, offset+1, offset, offset],
    notes: [
      CHROMATIC[(7  + offset+2) % 12],
      CHROMATIC[(0  + offset+1) % 12],
      CHROMATIC[(4  + offset)   % 12],
      CHROMATIC[(9  + offset)   % 12],
    ],
  };
}
function gShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const gFret   = (rootIdx - 7 + 24) % 12;
  const offset  = gFret;
  return {
    frets: [offset, offset+2, offset+3, offset+2],
    notes: [
      CHROMATIC[(7  + offset)   % 12],
      CHROMATIC[(0  + offset+2) % 12],
      CHROMATIC[(4  + offset+3) % 12],
      CHROMATIC[(9  + offset+2) % 12],
    ],
  };
}
function g7ShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const gFret   = (rootIdx - 7 + 24) % 12;
  const offset  = gFret;
  return {
    frets: [offset, offset+2, offset+1, offset+2],
    notes: [
      CHROMATIC[(7  + offset)   % 12],
      CHROMATIC[(0  + offset+2) % 12],
      CHROMATIC[(4  + offset+1) % 12],
      CHROMATIC[(9  + offset+2) % 12],
    ],
  };
}
function d7ShapeChord(rootNote) {
  const rootIdx = CHROMATIC.indexOf(rootNote);
  const cFret   = (rootIdx - 0 + 24) % 12;
  const offset  = cFret;
  return {
    frets: [offset, offset, offset, offset+1],
    notes: [
      CHROMATIC[(7  + offset)   % 12],
      CHROMATIC[(0  + offset)   % 12],
      CHROMATIC[(4  + offset)   % 12],
      CHROMATIC[(9  + offset+1) % 12],
    ],
  };
}

function makeFShapeList(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const { I, IV, V } = buildHpChordsForKey(keyIdx);
  return [I, IV, V].map(root => ({ name: toEnChordName(root, '', keyName), ...fShapeChord(root) }));
}
function makeAShapeList(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const { I, IV, V } = buildHpChordsForKey(keyIdx);
  return [I, IV, V].map(root => ({ name: toEnChordName(root, '', keyName), ...aShapeChord(root) }));
}
function makeBbShapeList(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const { I, IV, V } = buildHpChordsForKey(keyIdx);
  return [I, IV, V].map(root => ({ name: toEnChordName(root, '', keyName), ...bbShapeChord(root) }));
}
function makeGShapeList(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const { I, IV, V } = buildHpChordsForKey(keyIdx);
  return [I, IV, V].map(root => ({ name: toEnChordName(root, '', keyName), ...gShapeChord(root) }));
}
function makeG7ShapeList(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const V = CHROMATIC[(keyIdx + 7) % 12];
  return [V].map(root => ({ name: toEnChordName(root, '7', keyName), ...g7ShapeChord(root) }));
}
function makeD7ShapeListFull(keyIdx) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const V  = CHROMATIC[(keyIdx + 7) % 12];
  const I  = CHROMATIC[(keyIdx)     % 12];
  const IV = CHROMATIC[(keyIdx + 5) % 12];
  return [V, I, IV].map(root => ({ name: toEnChordName(root, '7', keyName), ...d7ShapeChord(root) }));
}

    },
    {
      shape_name: 'D7-Shape', root_string: 'C', root_string_num: 3,

      tip: '3弦(C弦)のフレット番号がコード名を決めます。',

  ];

  shapes.forEach(shape => {
    shape.chords = {};
    KEY_DEFS.forEach(kd => {
      shape.chords[kd.key] = shape.makeFn(kd.idx);
    });
  });
  return { shapes };
}

const MOVABLE_CHORDS = buildMovableChords();

// ---------------------------------------------------------------
// コード進行データ

function progChordName(keyIdx, semitones, suffix) {
  const keyName = KEY_DEFS.find(d => d.idx === keyIdx)?.key || 'C';
  const note = CHROMATIC[(keyIdx + semitones) % 12];
  return toEnChordName(note, suffix, keyName);
}

function buildProgressions(keyIdx) {
  const I  = (semi) => progChordName(keyIdx, semi, '');
  const Im = (semi) => progChordName(keyIdx, semi, 'm');

  return [

    { name:'I-IV-V',       label:'スリーコード',     emoji:'🎸', desc:'フォーク・ロックの基本形。シンプルで力強い。',               chords:[I(0),I(5),I(7)] },

    { name:'IIm-V-I',      label:'ツーファイブワン', emoji:'🎷', desc:'ジャズの基本。強い解決感が特徴。',                            chords:[Im(2),I(7),I(0)] },

const PROGRESSIONS = {};
KEY_DEFS.forEach(kd => {
  PROGRESSIONS[kd.key] = buildProgressions(kd.idx);
});

// ---------------------------------------------------------------
// 共通テーマカラー（isDarkパレット。描画系ファイルから呼び出す）

/**
 * ダーク/ライトモードに応じたSVGカラーセットを返す
 * @param {'fretboard'|'tab'|'melody'} variant
 * @returns {Object} カラーマップ
 */
function getThemeColors(variant) {
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const base = {
    string:  dark ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.18)',
    border:  dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.12)',
    bar:     dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.07)',
    text:    dark ? '#c2c0b6' : '#3d3d3a',
    text2:   dark ? '#5f5e5a' : '#b0ab9e',
    muted:   dark ? '#5f5e5a' : '#b0ab9e',
    nut:     dark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.35)',
    bg:      dark ? '#262623' : '#ffffff',
    dot:     dark ? '#4a9eff' : '#378ADD',
    dotRoot: '#1D9E75',
    focus:   dark ? 'rgba(29,158,117,0.16)' : 'rgba(29,158,117,0.10)',
    open:    '#888780',
    sep:     dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.10)',
  };
  if (variant === 'tab') {
    // drawTab用: stringの太さがやや細め
    return { ...base, string: dark ? 'rgba(255,255,255,0.20)' : 'rgba(0,0,0,0.16)',
                               focus: dark ? 'rgba(29,158,117,0.18)' : 'rgba(29,158,117,0.12)' };
  }
  return base;
}

// ---------------------------------------------------------------
// スケールモード定義（Phase 5c）
// 各モードはルートからの半音数の配列で定義
// ---------------------------------------------------------------
const SCALE_MODES = {
  major:       [0,2,4,5,7,9,11],  // イオニアン（メジャー）
  minor:       [0,2,3,5,7,8,10],  // ナチュラルマイナー（エオリアン）
  dorian:      [0,2,3,5,7,9,10],  // ドリアン（マイナー+長6度）
  mixolydian:  [0,2,4,5,7,9,10],  // ミクソリディアン（メジャー+短7度）
  pentatonic:  [0,2,4,7,9],       // メジャーペンタトニック
  minor_penta: [0,3,5,7,10],      // マイナーペンタトニック
  blues:       [0,3,5,6,7,10],    // ブルーススケール（マイナーペンタ+♭5ブルーノート）
};

/**
 * ルート音インデックスとモード名からスケール音配列を返す
 * @param {number} rootIdx  クロマチック上のインデックス（0=ド）
 * @param {string} modeName SCALE_MODESのキー
 * @returns {string[]} 日本語音名の配列
 */
function buildModeScale(rootIdx, modeName) {
  const steps = SCALE_MODES[modeName] || SCALE_MODES.major;
  return steps.map(s => CHROMATIC[(rootIdx + s) % 12]);
}
